name: Android Build & Test

# 职责：只跑 Android 单元测试（质量门禁）。
#
# ⚠️ 与 build-apk.yml 的分工（2026-10-30 收敛，此前两者重复构建 APK）：
#   - build-apk.yml  ：完整打包链路（vite build → cap sync → assembleDebug →
#                      发布 Release 直链），是 APK 的唯一产出方。
#   - 本工作流        ：只跑 testDebugUnitTest，不重复打包。
#   改造前本工作流也会 assembleDebug，但它缺少 cap sync / shared 依赖安装
#   等前置步骤，且 JDK 版本与工程要求不符，长期红灯。
#
# 失败根因记录（2026-10-30）：
#   1. JDK 用 17，而工程 compileOptions / kotlinOptions.jvmTarget 均为
#      Java 21（见 app/build.gradle 与 capacitor.build.gradle），
#      AGP 8.13 + Kotlin 在 JDK 17 下无法完成编译，testDebugUnitTest 失败。
#   2. 缺少 chmod +x gradlew 之外的其它前置，且无 shared 依赖安装。

on:
  push:
    branches: [main, develop]
    paths:
      - '思忆集手机端app/android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
    paths:
      - '思忆集手机端app/android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  unit-test:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        # 工程 jvmTarget / compileOptions 均为 Java 21，必须用 21。
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run unit tests
        working-directory: ./思忆集手机端app/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace
