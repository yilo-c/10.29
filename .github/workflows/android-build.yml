name: Android Build & Test

# 职责：只跑 Android 单元测试（质量门禁）。
#
# ⚠️ 与 build-apk.yml 的分工（2026-10-30 收敛，此前两者重复构建 APK）：
#   - build-apk.yml  ：完整打包链路（vite build → cap sync → assembleDebug →
#                      发布 Release 直链），是 APK 的唯一产出方。
#   - 本工作流        ：只跑 testDebugUnitTest，不重复打包。
#
# 历史失败根因（2026-10-30 逐项排查）：
#   1. JDK 17 → 21：工程 compileOptions 与 kotlinOptions.jvmTarget 均为
#      Java 21（见 app/build.gradle、capacitor.build.gradle）。
#   2. 缺少 Android SDK 配置：testDebugUnitTest 仍要解析 compileSdk 36
#      与 build-tools，未配置时 Gradle 报 SDK location not found。
#   3. 缺少 shared 包依赖：@desk-notes/shared 是 file: 依赖，其自身
#      react/zustand 等未安装时，配置阶段解析失败。
#   4. 失败时无可见错误：job log 与 artifact 需认证，故增加 ::error:: 注解
#      （可通过公开 REST 的 check-runs/{id}/annotations 读取）。

on:
  push:
    branches: [main, develop]
    paths:
      - '思忆集手机端app/android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
    paths:
      - '思忆集手机端app/android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  unit-test:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        # 工程 jvmTarget / compileOptions 均为 Java 21，必须用 21。
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK
        # runner 预装 SDK（/usr/local/lib/android/sdk）；不走 setup-android
        # （其 sdkmanager tools 调用已失效）。与 build-apk.yml 保持一致。
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT"     >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager)"; fi
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-36" \
                    "build-tools;36.0.0" "build-tools;35.0.0"
          ls "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools"

      - name: Install shared package deps
        working-directory: desk-notes/packages/shared
        run: npm install --no-audit --no-fund

      - name: Install mobile deps
        working-directory: ./思忆集手机端app
        run: npm install --no-audit --no-fund

      - name: Build web assets
        working-directory: ./思忆集手机端app
        run: npx vite build

      - name: Capacitor sync
        # 必需：capacitor-cordova-android-plugins/ 整个目录（含
        # cordova.variables.gradle、capacitor.settings.gradle 引用的各插件
        # 工程）都是 cap sync 的生成物，不入库。缺这一步时 Gradle 配置阶段
        # 直接报 Could not read script .../cordova.variables.gradle as it does
        # not exist（实测 run 40969960128）。
        # 与 build-apk.yml 保持一致。
        working-directory: ./思忆集手机端app
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run unit tests
        working-directory: ./思忆集手机端app/android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-test.log

      - name: Diagnostics on failure
        if: failure()
        run: |
          {
            echo "### Android 单测失败诊断"
            echo '```'
            grep -nE "FAILURE|error:|What went wrong|> Task .* FAILED|Could not|SDK location|Unsupported" /tmp/gradle-test.log 2>/dev/null | head -40 || echo "（未匹配到常见模式）"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 公开可读通道：check-run annotations
          KT=$(grep -E "^e: file:///" /tmp/gradle-test.log 2>/dev/null | head -20 || true)
          WW=$(grep -A 12 "What went wrong" /tmp/gradle-test.log 2>/dev/null | head -18 || true)
          MSG=$(printf '%s\n%s' "$KT" "$WW" | tr '\n' '\r' | sed 's/\r/%0A/g' | cut -c1-3500)
          if [ -z "$MSG" ]; then MSG=$(tail -20 /tmp/gradle-test.log | tr '\n' '\r' | sed 's/\r/%0A/g' | cut -c1-3500); fi
          echo "::error title=Android unit tests failed::${MSG}"
