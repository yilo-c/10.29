name: Build Android APK

# 为什么需要这个工作流：
#   手机本地（ARM aarch64 proot）无法编译 APK，实测已确认两个硬性障碍：
#     1. Google Android SDK 的 aapt2 只提供 x86-64 二进制，无 ARM 版，
#        在 aarch64 上执行报 "cannot execute: required file not found"，
#        资源编译阶段 aapt2 Daemon startup failed（108 个任务已完成，仅卡此步）。
#     2. Gradle + AGP 峰值内存 3~4 GB，而手机可用内存约 3.5 GB。
#   GitHub 的 ubuntu-latest runner 是 x86-64 且预装 JDK/SDK，正好合适。
#
# 与 mobile-ci.yml 的分工：
#   mobile-ci.yml 负责质量门禁（typecheck / vitest / audit），本工作流只做打包，
#   因此不再重复跑 typecheck 和测试，避免浪费 CI 时间。
#
# 产物：本次运行页面底部 Artifacts → app-debug-apk

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**']
    paths:
      - '思忆集手机端app/**'
      - 'desk-notes/packages/shared/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '思忆集手机端app/**'
  workflow_dispatch:   # 支持在 Actions 页面手动触发

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 思忆集手机端app/package-lock.json

      - name: Setup JDK 21
        # 工程 kotlinOptions.jvmTarget = "21"，且 AGP 8.13 支持 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        # 显式安装，不依赖 setup-android 的默认行为：
        # 工程 variables.gradle 要求 compileSdk 36 / build-tools 36，
        # 而 setup-android@v3 预置的往往不是 36。缺包会报
        # "Failed to find target with hash string 'android-36'"。
        # 另外 35 与 34 是部分 Capacitor 插件的编译目标，一并装上避免中途失败。
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" \
                     "platforms;android-36" \
                     "platforms;android-35" \
                     "platforms;android-34" \
                     "build-tools;36.0.0" \
                     "build-tools;35.0.0"

      - name: Install shared package deps
        # @desk-notes/shared 是 file: 本地依赖（symlink），
        # 整仓 checkout 后相对路径可解析；这里装它自身的 react/zustand 等依赖。
        working-directory: desk-notes/packages/shared
        run: npm install --no-audit --no-fund

      - name: Install mobile deps
        working-directory: 思忆集手机端app
        run: npm ci

      - name: Build web assets
        working-directory: 思忆集手机端app
        run: npx vite build

      - name: Capacitor sync
        working-directory: 思忆集手机端app
        run: npx cap sync android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('思忆集手机端app/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APK
        working-directory: 思忆集手机端app/android
        run: |
          # gradlew 在版本库里的权限位是 100644（非可执行），
          # Linux runner 上直接 ./gradlew 会 Permission denied。
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: 思忆集手机端app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        if: always()
        working-directory: 思忆集手机端app/android/app/build/outputs/apk/debug
        run: |
          if ls *.apk >/dev/null 2>&1; then
            echo "### APK 构建成功" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            ls -lh *.apk >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "在本次运行页面的 **Artifacts** 区下载 \`app-debug-apk\`，传到手机安装。" >> $GITHUB_STEP_SUMMARY
          else
            echo "### APK 未生成，请查看上方构建日志" >> $GITHUB_STEP_SUMMARY
          fi
