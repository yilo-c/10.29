name: Build Android APK

# 为什么需要这个工作流：
#   手机本地（ARM aarch64 proot）无法编译 APK，实测已确认两个硬性障碍：
#     1. Google Android SDK 的 aapt2 只提供 x86-64 二进制，无 ARM 版，
#        在 aarch64 上执行报 "cannot execute: required file not found"，
#        资源编译阶段 aapt2 Daemon startup failed（108 个任务已完成，仅卡此步）。
#     2. Gradle + AGP 峰值内存 3~4 GB，而手机可用内存约 3.5 GB。
#   GitHub 的 ubuntu-latest runner 是 x86-64 且预装 JDK/SDK，正好合适。
#
# ⚠️ 不使用 android-actions/setup-android@v3：
#   该 action 会执行 `sdkmanager tools` 来对齐版本，但新版 cmdline-tools 里
#   'tools' 包已不存在，报 `Warning: Failed to find package 'tools'` 后 exit 1，
#   导致整条作业在 Setup Android SDK 阶段失败（实测 run 40880889829）。
#   runner 本身预装了 SDK（/usr/local/lib/android/sdk），直接用即可。
#
# 与 mobile-ci.yml 的分工：
#   mobile-ci.yml 负责质量门禁（typecheck / vitest / audit），本工作流只做打包。
#
# 产物：本次运行页面底部 Artifacts → app-debug-apk

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**']
    paths:
      - '思忆集手机端app/**'
      - 'desk-notes/packages/shared/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '思忆集手机端app/**'
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

# 发布 Release 需要写权限。仓库默认 GITHUB_TOKEN 为只读，
# 不显式声明会报 "Resource not accessible by integration"。
permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        # 必须 22+：@capacitor/cli@8.4.0 的 engines 要求 node >= 22.0.0，
        # 用 Node 20 会在 npm ci 阶段报 EBADENGINE 并在后续步骤失败。
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 思忆集手机端app/package-lock.json

      - name: Setup JDK 21
        # 工程 kotlinOptions.jvmTarget = "21"，AGP 8.13 支持 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK
        # runner 预装 SDK 在 /usr/local/lib/android/sdk；这里只补齐工程所需组件，
        # 不走 setup-android（其 sdkmanager tools 调用已失效）。
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT"        >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"    >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "使用 SDK: $SDK_ROOT"
          ls "$SDK_ROOT"

          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(command -v sdkmanager)"
          fi
          echo "sdkmanager: $SDKMGR"

          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" \
                    "platforms;android-36" \
                    "platforms;android-35" \
                    "platforms;android-34" \
                    "build-tools;36.0.0" \
                    "build-tools;35.0.0"
          echo "--- 已安装 ---"
          ls "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools"

      - name: Install shared package deps
        # @desk-notes/shared 是 file: 本地依赖（symlink），
        # 整仓 checkout 后相对路径可解析；这里装它自身的 react/zustand 等依赖。
        working-directory: desk-notes/packages/shared
        run: npm install --no-audit --no-fund

      - name: Install mobile deps
        working-directory: 思忆集手机端app
        # 用 npm install 而非 npm ci：
        # package-lock.json 与 package.json 的版本范围在 CI 的 npm 下不同步
        # （实测报 "Missing: esbuild@0.28.2 from lock file"），
        # npm ci 会严格校验并直接失败。npm install 会按 package.json 重新解析，
        # 对本项目（依赖少、无 workspaces）代价可接受。
        run: npm install --no-audit --no-fund

      - name: Build web assets
        working-directory: 思忆集手机端app
        run: npx vite build

      # ── E2E 门禁（本次新增）：改坏了就不出 APK ────────────────────
      # 为什么放在 cap sync 之前：
      #   ① e2e 更快（约 30s），早失败省掉后面 Gradle 的数分钟；
      #   ② 这里是「App 能不能用」的唯一自动化证据——
      #      201 个单测只证明纯函数算得对，证明不了界面能用。
      # 为什么必须先装内核：GitHub runner 不自带 Playwright 浏览器。
      - name: Install Playwright Chromium
        working-directory: 思忆集手机端app
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (blocks APK on failure)
        working-directory: 思忆集手机端app
        # webServer 会自己起 vite preview（复用刚 build 的 dist），只绑 127.0.0.1
        run: npx playwright test --reporter=list

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            思忆集手机端app/test-results/
            思忆集手机端app/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Capacitor sync
        working-directory: 思忆集手机端app
        run: npx cap sync android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('思忆集手机端app/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APK
        id: build
        working-directory: 思忆集手机端app/android
        run: |
          # gradlew 在版本库里的权限位是 100644（非可执行），
          # Linux runner 上直接 ./gradlew 会 Permission denied。
          chmod +x gradlew
          # tee 到文件：失败时把关键错误写进 Step Summary，
          # 这样不依赖 job log 权限也能看到真实原因
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          exit ${PIPESTATUS[0]}

      - name: Gradle failure diagnostics
        if: failure()
        run: |
          {
            echo "### Gradle 构建失败诊断"
            echo '```'
            grep -nE "FAILURE|error:|Caused by|What went wrong|> Task .* FAILED|Could not|Unsupported|requires" /tmp/gradle.log 2>/dev/null | head -40 || echo "（未匹配到常见错误模式）"
            echo '```'
            echo "#### 最后 60 行"
            echo '```'
            tail -60 /tmp/gradle.log 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 额外：把关键错误以 ::error:: 注解输出。
          # 原因：job log 与 artifact 下载都需要认证，而 Step Summary 页面是
          # JS 渲染抓不到；只有 annotations 可以通过公开 REST 读取
          # （/repos/{owner}/{repo}/check-runs/{id}/annotations）。
          # 这样任何只能访问公开 API 的排查方都能看到真实报错。
          ERR_TEXT=$(grep -A 12 "What went wrong" /tmp/gradle.log 2>/dev/null | head -20 || true)
          # Kotlin 编译错误单独抓：格式为 "e: file:///path/Xxx.kt:12:34 message"
          KT_ERRS=$(grep -E "^e: file:///" /tmp/gradle.log 2>/dev/null | head -25 || true)
          if [ -n "$KT_ERRS" ]; then
            ERR_TEXT=$(printf '=== Kotlin 编译错误 ===\n%s\n=== What went wrong ===\n%s' "$KT_ERRS" "$ERR_TEXT")
          fi
          if [ -z "$ERR_TEXT" ]; then
            ERR_TEXT=$(tail -20 /tmp/gradle.log 2>/dev/null || echo "no log")
          fi
          # ::error:: 单条消息上限 4000 字符，且换行需转义为 %0A
          MSG=$(printf '%s' "$ERR_TEXT" | tr '\n' '\r' | sed 's/\r/%0A/g' | cut -c1-3500)
          echo "::error title=Gradle build failed::${MSG}"

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: 思忆集手机端app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      # 发布到 Release：artifact 下载必须登录认证，而 Release 资产有公开直链，
      # 手机端（无 GitHub 登录态）可以直接 curl 下载。
      - name: Publish APK to Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK_DIR="思忆集手机端app/android/app/build/outputs/apk/debug"
          APK="$(ls "$APK_DIR"/*.apk | head -1)"
          TAG="apk-${GITHUB_SHA::7}"
          cp "$APK" /tmp/app-debug.apk

          # 已存在同 tag 则先删（重跑同一 commit 时避免冲突）
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true

          gh release create "$TAG" /tmp/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "APK ${GITHUB_SHA::7}" \
            --notes "自动构建的 debug APK（commit ${GITHUB_SHA}）。
          
          下载直链（无需登录）：
          https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/app-debug.apk"

      - name: Summary
        if: always()
        run: |
          DIR="思忆集手机端app/android/app/build/outputs/apk/debug"
          if [ -d "$DIR" ] && ls "$DIR"/*.apk >/dev/null 2>&1; then
            {
              echo "### APK 构建成功"
              echo '```'
              ls -lh "$DIR"/*.apk
              echo '```'
              echo "Artifacts 区：\`app-debug-apk\`（需登录）"
              echo ""
              echo "公开直链（无需登录）："
              echo "\`\`\`"
              echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-${GITHUB_SHA::7}/app-debug.apk"
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### APK 未生成，请查看上方构建日志" >> "$GITHUB_STEP_SUMMARY"
          fi
