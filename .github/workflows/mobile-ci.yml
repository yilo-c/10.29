name: Mobile CI

# B5-基建11（批次5）：手机端（Capacitor+React，vitest）测试正式接入 CI。
# 此前手机端测试只在开发者本地跑，CI 无覆盖；本次补齐后 push/PR 改动
# 思忆集手机端app/ 即触发 typecheck + vitest + 生产依赖 audit 三道硬门禁。

on:
  push:
    branches: [main, develop, 'fix/**', 'feat/**']
    paths:
      - "思忆集手机端app/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "思忆集手机端app/**"
      - ".github/workflows/mobile-ci.yml"

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./思忆集手机端app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        # 必须 22+：@capacitor/cli@8.4.0 的 engines 要求 node >= 22.0.0。
        # 此前这里用 Node 20，npm ci 阶段 EBADENGINE 直接失败，
        # 导致 Mobile CI 长期红灯（Type check / vitest 全部 skipped）。
        # 与 build-apk.yml 保持一致。
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install shared package deps
        # @desk-notes/shared 是 file: 本地依赖（symlink）。它有自己的
        # dependencies（react/zustand/fuse.js/lunar-javascript），
        # 不装会让手机端 typecheck 解析 React 类型时回落失败。
        # 与 build-apk.yml 的步骤顺序保持一致。
        working-directory: desk-notes/packages/shared
        run: npm install --no-audit --no-fund

      - name: Install dependencies
        # 用 npm install 而非 npm ci：package-lock.json 与 package.json
        # 在 CI 的 npm 下不同步（实测 "Missing: esbuild@0.28.2 from lock file"），
        # npm ci 严格校验会直接失败。与 build-apk.yml 保持一致。
        run: npm install --no-audit --no-fund

      - name: Type check
        # 只检查手机端自身代码（tsconfig include: ["src"]）；
        # shared 源码经 paths 引入并被检查，但不跑 shared 自己的 tsc。
        run: npm run typecheck

      - name: Run tests (vitest)
        run: npm test

      - name: Audit prod deps (npm, E3 hard gate)
        # 与 desk-notes 的 pnpm audit --prod 对齐：仅审计生产依赖，
        # 存在 high/critical 即非零退出，阻断合并。
        run: npm audit --omit=dev --audit-level high
