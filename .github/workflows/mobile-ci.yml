name: Mobile CI

# B5-基建11（批次5）：手机端（Capacitor+React，vitest）测试正式接入 CI。
# 此前手机端测试只在开发者本地跑，CI 无覆盖；本次补齐后 push/PR 改动
# 思忆集手机端app/ 即触发 typecheck + vitest + 生产依赖 audit 三道硬门禁。

on:
  push:
    branches: [main, develop, 'fix/**', 'feat/**']
    paths:
      - "思忆集手机端app/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "思忆集手机端app/**"
      - ".github/workflows/mobile-ci.yml"

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./思忆集手机端app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        # 手机端用 npm（package-lock.json 已就位）。@desk-notes/shared 等
        # file: 本地依赖在整仓 checkout 后相对路径可解析。
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests (vitest)
        run: npm test

      - name: Audit prod deps (npm, E3 hard gate)
        # 与 desk-notes 的 pnpm audit --prod 对齐：仅审计生产依赖，
        # 存在 high/critical 即非零退出，阻断合并。
        run: npm audit --omit=dev --audit-level high
