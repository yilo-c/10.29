name: Build Siyi DSH App

# 思路：
#   1. 下载官方 DSH-Android APK（含 libnode.so 等 native lib + engine.zip）
#   2. 从 APK 提取 4 个必需 .so 和 engine.zip
#   3. CI 现场 pnpm 构建 web profile（base + web-app → 54 个 client-ui + 前端 dist）
#   4. 全部打包进自己的 APK
# 仓库里不放任何二进制，官方升级只改 DSH_VERSION / DSH_PKG_VERSION 两行。

on:
  push:
    branches: [ dsh-app ]
    paths:
      - 'siyi-dsh-app/**'
      - '.github/workflows/siyi-dsh-build.yml'
  workflow_dispatch:

env:
  DSH_VERSION: v0.3.11
  DSH_PKG_VERSION: 0.2.1-rc.5
  APP_DIR: siyi-dsh-app

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download DSH APK
        run: |
          set -e
          VER="${{ github.event.inputs.dsh_version || env.DSH_VERSION }}"
          URL="https://github.com/jackwener/DSH-Android/releases/download/${VER}/DSH-Android-${VER}-arm64.apk"
          echo "下载 $URL"
          curl -fL --retry 3 -o dsh.apk "$URL"
          ls -lh dsh.apk

      - name: Extract native libs
        run: |
          set -e
          mkdir -p "$APP_DIR/app/src/main/jniLibs/arm64-v8a"
          unzip -o -j dsh.apk \
            'lib/arm64-v8a/libnode.so' \
            'lib/arm64-v8a/libdshnode.so' \
            'lib/arm64-v8a/libc++_shared.so' \
            'lib/arm64-v8a/libdsh_flock.so' \
            'lib/arm64-v8a/librg.so' \
            -d "$APP_DIR/app/src/main/jniLibs/arm64-v8a"
          chmod 755 "$APP_DIR/app/src/main/jniLibs/arm64-v8a/"*.so
          ls -lh "$APP_DIR/app/src/main/jniLibs/arm64-v8a"

      - name: Extract engine.zip
        run: |
          set -e
          mkdir -p "$APP_DIR/app/src/main/assets"
          unzip -o -j dsh.apk 'assets/engine.zip' -d "$APP_DIR/app/src/main/assets"
          ls -lh "$APP_DIR/app/src/main/assets/engine.zip"

      # plugin-account 只在 engine.zip 里（不在 npm 上），运行时由 App 建软链。
      # 所以在 engine.zip 内部打补丁：解包 → 改 → 重新打包。
      - name: Patch engine.zip (plugin-account)
        run: |
          set -e
          # 必须用绝对路径：下面会 cd 到临时目录，相对路径会失效
          ZIP=$(readlink -f "$GITHUB_WORKSPACE/$APP_DIR/app/src/main/assets/engine.zip")
          PATCHER=$(readlink -f "$GITHUB_WORKSPACE/$APP_DIR/patches/fix-account-webcombo.mjs")
          echo "ZIP: $ZIP"
          test -f "$ZIP" || { echo "找不到 engine.zip"; exit 1; }
          test -f "$PATCHER" || { echo "找不到补丁脚本"; exit 1; }

          W=$(mktemp -d)
          cd "$W"
          unzip -q "$ZIP"
          cd - > /dev/null

          # 1) plugin-account 补丁（按字符串改）
          node "$PATCHER" "$W"

          # 2) 设备桥：用仓库里改好的 plugin-device 覆盖原始版本。
          #    官方走 DSH_BRIDGE_FD 传 fd，但 Android 的 ProcessBuilder 只保留 0/1/2，
          #    ≥3 的 fd 一律关闭，那条路永远拿不到可用 fd，引擎报
          #    "Unsupported fd type: UNKNOWN"。改后的版本支持 DSH_BRIDGE_SOCK。
          SRC=$(readlink -f "$GITHUB_WORKSPACE/$APP_DIR/patches/plugin-device")
          test -d "$SRC" || { echo "找不到 patches/plugin-device"; exit 1; }
          DEV="$W/node_modules/@dsh-android/plugin-device"
          test -d "$DEV" || { echo "解包目录里找不到 plugin-device"; exit 1; }
          cp "$SRC/index.js" "$DEV/index.js"
          cp "$SRC/bridge.js" "$DEV/bridge.js"
          echo "已覆盖 plugin-device"

          # 3) 终端：subprocess-local 的 createProcessInspector 只认 linux/darwin/win32，
          #    android 直接抛「terminal inspection is unsupported」。
          #    Android 内核就是 Linux，/proc 字段齐全，复用 Linux 实现即可。
          TERM_PATCHER=$(readlink -f "$GITHUB_WORKSPACE/$APP_DIR/patches/fix-terminal-android.mjs")
          test -f "$TERM_PATCHER" || { echo "找不到 fix-terminal-android.mjs"; exit 1; }
          node "$TERM_PATCHER" "$W/node_modules"
          T=$(grep -rl 'platform === "android"' "$W/node_modules/@deepseek-ai/dsh-subprocess-local/lib/" 2>/dev/null | wc -l)
          echo "补丁校验 terminal android 分支: $T"
          test "$T" -gt 0 || { echo "terminal 补丁未生效"; exit 1; }

          # 4) 重新打包
          cd "$W"
          rm -f "$ZIP"
          zip -q -r "$ZIP" . > /dev/null
          cd - > /dev/null
          rm -rf "$W"
          echo "engine.zip 大小: $(stat -c%s "$ZIP") 字节"

          # 5) 双项校验，任一未生效就失败
          V=$(unzip -p "$ZIP" 'node_modules/@dsh-android/plugin-account/index.js' | grep -c existingWebServer || true)
          echo "补丁校验 account existingWebServer: $V"
          test "$V" -gt 0 || { echo "plugin-account 补丁未生效"; exit 1; }

          D=$(unzip -p "$ZIP" 'node_modules/@dsh-android/plugin-device/index.js' | grep -c DSH_BRIDGE_SOCK || true)
          echo "补丁校验 device DSH_BRIDGE_SOCK: $D"
          test "$D" -gt 0 || { echo "plugin-device 补丁未生效"; exit 1; }

      - name: Build web profile
        run: |
          set -e
          PDIR="$APP_DIR/profile-build/profiles/web"
          mkdir -p "$PDIR"
          cp "$APP_DIR/app/src/main/assets/profile-template.json" "$PDIR/package.json"
          cp "$APP_DIR/app/src/main/assets/profile-patch.yml" "$PDIR/cordis.patch.yml"
          cd "$PDIR"
          npx --yes pnpm@11.28.9 add "@deepseek-ai/dsh-base@${DSH_PKG_VERSION}" "@deepseek-ai/dsh-web-app@${DSH_PKG_VERSION}" "@snnh/dsh-llm-service-lite@0.2.1" --config.node-linker=hoisted --config.package-import-method=copy --config.ignore-scripts=true
          WS="${GITHUB_WORKSPACE:-$PWD}"
          echo "WS=$WS"
          # Android 适配：三个关键包必须用引擎 APK 内的定制版
          # dsh-app-boot 双实例会让 settings 写入失败；node-addon-system 与
          # session-persistence-jsonl 的 npm 原版在 Android 上分别报 flock / link 错误。
          mkdir -p "$WS/engine-native"
          unzip -q -o "$WS/dsh.apk" "assets/engine.zip" -d "$WS/engine-native"
          unzip -q -o "$WS/engine-native/assets/engine.zip" -d "$WS/engine-native" "node_modules/@deepseek-ai/dsh-app-boot/*" "node_modules/@deepseek-ai/node-addon-system/*" "node_modules/@deepseek-ai/dsh-session-persistence-jsonl/*"
          for pkg in dsh-app-boot node-addon-system dsh-session-persistence-jsonl; do
            rm -rf "node_modules/@deepseek-ai/$pkg"
            cp -r "$WS/engine-native/node_modules/@deepseek-ai/$pkg" "node_modules/@deepseek-ai/$pkg"
            echo "unified $pkg"
          done
          # 思忆集移动端布局插件：修正窄屏设置面板的两栏挤压与中文逐字换行。
          # 客户端插件清单只扫描 cordis 树里的 entry，所以除了复制进 node_modules，
          # 还必须在 assets/profile-patch.yml 里 insert（已做）。
          rm -rf "node_modules/dsh-client-ui-siyi-mobile"
          cp -r "$WS/$APP_DIR/plugins/dsh-client-ui-siyi-mobile" "node_modules/dsh-client-ui-siyi-mobile"
          echo "plugin installed: $(ls node_modules/dsh-client-ui-siyi-mobile/lib)"
          # 用户插件动态加载器：让 App 免 CI 自己加能力
          rm -rf "node_modules/dsh-user-plugins"
          cp -r "$WS/$APP_DIR/plugins/dsh-user-plugins" "node_modules/dsh-user-plugins"
          echo "user-plugins loader installed: $(ls node_modules/dsh-user-plugins/lib)"

          # 修正 shell 写死成 bash 的问题：普通 node 启动时 platform 是 linux，
          # 两个插件会去 spawn bash，而 Android 只有 /system/bin/sh，
          # 所有 shell 工具都会报 spawn bash EACCES。
          node "$WS/$APP_DIR/patches/fix-android-bash.mjs" "$WS/$APP_DIR/profile-build/profiles/web"

          echo "包数: $(ls node_modules/@deepseek-ai | wc -l)"
          echo "client-ui: $(ls node_modules/@deepseek-ai | grep -c client-ui || true)"
          ls -la "$WS/$APP_DIR/profile-build/profiles" || true
          # Android 侧只有 ZipInputStream，所以打成 zip 而不是 tgz
          cd "$WS/$APP_DIR/profile-build"
          zip -qr "$WS/$APP_DIR/app/src/main/assets/web-profile.zip" profiles
          cd - > /dev/null
          ls -lh "$WS/$APP_DIR/app/src/main/assets/web-profile.zip"

      - name: Build debug APK
        run: |
          cd "$APP_DIR"
          # versionCode 用日期+运行号递增，避免部分 ROM 因 versionCode 不变而拒绝覆盖。
          # ⚠ 必须是 int32：Android 的 versionCode 上限 2147483647。
          # 之前拼成 2026111243136691423（19 位）会直接溢出，
          # 所以改成 日期*100 + 运行号后两位 = 2026111200 ~ 2026111299。
          VC=$(( $(date -u +%Y%m%d) * 100 + GITHUB_RUN_NUMBER % 100 ))
          VN="1.0.0"
          echo "SIYI_VERSION_CODE=$VC" >> $GITHUB_ENV
          echo "SIYI_VERSION_NAME=$VN" >> $GITHUB_ENV
          echo "versionCode=$VC versionName=$VN"
          pwd; ls -la settings.gradle build.gradle
          # ⚠ 必须在这里把变量直接导给 gradle：$GITHUB_ENV 只对**后续**步骤生效，
          # 同一步骤里读不到。所以之前 gradle 一直拿默认值 2026111201，
          # 每次构建的 versionCode 都不变，部分 ROM 会拒绝覆盖安装。
          # 写进 properties 文件：Gradle 配置阶段读 System.getenv 拿不到同一步骤 export 的值，
          # 之前 versionCode 一直是默认值。现在直接落到文件里，Gradle 用 findProperty 读。
          printf 'siyi.versionCode=%s\nsiyi.versionName=%s\n' "$VC" "$VN" > app/version.properties
          cat app/version.properties
          gradle assembleDebug --no-daemon --stacktrace

      # NDK 编译 jniLibs 时会把它自带的精简版 libc++_shared.so（约 1.3MB）打进 APK，
      # 覆盖 jniLibs 里从官方 APK 提取的完整版（约 8.9MB）。libnode.so 依赖完整版，
      # 换成精简版后引擎启动即崩。AGP 8 已移除 cmake.arguments DSL，
      # ANDROID_STL 也无处可设，所以在打包完成后直接从 APK 里替换回来。
      - name: Fix libc++_shared.so in APK
        run: |
          set -e
          # 必须转绝对路径：下面会 cd 到临时目录，相对路径会失效
          APK=$(ls "$PWD/$APP_DIR"/app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(ls "$GITHUB_WORKSPACE/$APP_DIR"/app/build/outputs/apk/debug/*.apk | head -1)
          fi
          APK=$(readlink -f "$APK")
          echo "APK: $APK"
          test -f "$APK" || { echo "找不到 APK"; exit 1; }
          GOOD=$(readlink -f "$GITHUB_WORKSPACE/$APP_DIR/app/src/main/jniLibs/arm64-v8a/libc++_shared.so")
          test -f "$GOOD" || { echo "找不到官方版 libc++"; exit 1; }
          echo "官方版大小: $(stat -c%s "$GOOD") 字节"

          # 解出 APK，替换 libc++，再重新打包
          W=$(mktemp -d)
          cd "$W"
          unzip -q "$APK"
          BEFORE=$(stat -c%s lib/arm64-v8a/libc++_shared.so)
          echo "包内原大小: $BEFORE 字节"
          cp "$GOOD" lib/arm64-v8a/libc++_shared.so
          AFTER=$(stat -c%s lib/arm64-v8a/libc++_shared.so)
          echo "替换后大小: $AFTER 字节"

          # 重新打包。
          # -n 后缀列表必须包含 resources.arsc 与 AndroidManifest.xml：
          #   Android 11+ 直接 mmap resources.arsc，压缩存储会报「系统不兼容」拒绝安装。
          #   .so 同理（extractNativeLibs=false 时直接从 APK 加载）。
          rm -f "$APK"
          zip -q -r -n .so:.zip:.arsc:.png:.jpg:.jpeg:.webp "$APK" . \
            -x 'META-INF/*.RSA' 'META-INF/*.SF' 'META-INF/*.MF' > /dev/null
          cd - > /dev/null
          rm -rf "$W"

          # 重新签名
          BT=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -1)
          # 签名密钥必须固定，否则每次 CI 都生成新密钥，
          # 导致新包无法覆盖安装（报「与已安装应用签名不同」，error -7）。
          # 优先用仓库里固化的 keystore；没有则临时生成并上传为 artifact，
          # 由维护者下载后提交进仓库，之后所有版本复用同一把。
          KS="$GITHUB_WORKSPACE/$APP_DIR/keystore/debug.keystore"
          # 指纹必须是这把：设备上已安装的版本就是用它签的。
          # 换任何一把都会导致覆盖安装失败（INSTALL_FAILED_UPDATE_INCOMPATIBLE，-7）。
          KS_SHA=83a7e5148bd2bfd6360b90cb2cc2676787a334b7a3b366355858f273da3c80ed
          if [ ! -f "$KS" ]; then
            echo "::error::仓库里没有 keystore/debug.keystore，拒绝随机生成（换了钥匙就装不上了）"
            exit 1
          fi
          GOT_SHA=$(sha256sum "$KS" | cut -d' ' -f1)
          echo "keystore 指纹: $GOT_SHA"
          if [ "$GOT_SHA" != "$KS_SHA" ]; then
            echo "::error::keystore 指纹不符：期望 $KS_SHA，实际 $GOT_SHA。拒绝签名，否则覆盖安装会失败(-7)。"
            exit 1
          fi
          echo "使用仓库固化的 keystore（指纹已核对）"
          "$BT/zipalign" -f -p 4 "$APK" "$APK.aligned"
          # 显式指定 v1+v2+v3，缺 v2 会导致 Android 7+ 报「系统不兼容」
          "$BT/apksigner" sign --ks "$KS" --ks-pass pass:android --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$APK" "$APK.aligned"
          rm -f "$APK.aligned"

          echo "--- 最终校验 ---"
          unzip -l "$APK" | grep "libc++_shared" || true
          "$BT/apksigner" verify "$APK" && echo "签名校验通过"

      # keystore 只在首次生成时存在；无条件尝试上传，没有文件时静默跳过。
      # 用 hashFiles 做 if 条件在 job 早期会返回空，所以改用 if-no-files-found: ignore。
      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: siyi-keystore
          path: ${{ env.APP_DIR }}/keystore/debug.keystore
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: siyi-dsh-debug-apk
          path: ${{ env.APP_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
