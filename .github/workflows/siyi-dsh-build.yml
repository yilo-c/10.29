name: Build Siyi DSH App

# 思路：
#   1. 下载官方 DSH-Android APK（含 libnode.so / libdshnode.so / 引擎树）
#   2. 从 APK 里提取 4 个必需 .so + 引擎 assets/engine.zip
#   3. 与本仓库的 Kotlin 壳、页面一起编译成自己的 APK
# 好处：仓库里不放 90MB 二进制，官方升级时只改版本号。

on:
  push:
    branches: [ dsh-app, main ]
    paths:
      - 'siyi-dsh-app/**'
      - '.github/workflows/siyi-dsh-build.yml'
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'DSH-Android 版本（留空用最新）'
        required: false
        default: ''

env:
  DSH_VERSION: v0.3.11
  APP_DIR: siyi-dsh-app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Download DSH APK
        run: |
          set -e
          VER="${{ github.event.inputs.dsh_version || env.DSH_VERSION }}"
          URL="https://github.com/jackwener/DSH-Android/releases/download/${VER}/DSH-Android-${VER}-arm64.apk"
          echo "下载 $URL"
          curl -fL --retry 3 -o dsh.apk "$URL"
          ls -lh dsh.apk

      - name: Extract native libs and engine
        run: |
          set -e
          mkdir -p "$APP_DIR/app/src/main/jniLibs/arm64-v8a"
          # 提取 4 个必需 .so
          unzip -o -j dsh.apk 'lib/arm64-v8a/libnode.so' 'lib/arm64-v8a/libdshnode.so' \
            'lib/arm64-v8a/libc++_shared.so' 'lib/arm64-v8a/libdsh_flock.so' \
            -d "$APP_DIR/app/src/main/jniLibs/arm64-v8a"
          chmod 755 "$APP_DIR/app/src/main/jniLibs/arm64-v8a/"*.so
          ls -lh "$APP_DIR/app/src/main/jniLibs/arm64-v8a"

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}
        run: |
          chmod +x gradlew || true
          gradle wrapper --gradle-version 8.7 || true
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: siyi-dsh-debug-apk
          path: ${{ env.APP_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
