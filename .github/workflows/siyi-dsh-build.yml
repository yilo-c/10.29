name: Build Siyi DSH App

# 思路：
#   1. 下载官方 DSH-Android APK（含 libnode.so 等 native lib + engine.zip）
#   2. 从 APK 提取 4 个必需 .so 和 engine.zip
#   3. CI 现场 pnpm 构建 web profile（base + web-app → 54 个 client-ui + 前端 dist）
#   4. 全部打包进自己的 APK
# 仓库里不放任何二进制，官方升级只改 DSH_VERSION / DSH_PKG_VERSION 两行。

on:
  push:
    branches: [ dsh-app, main ]
    paths:
      - 'siyi-dsh-app/**'
      - '.github/workflows/siyi-dsh-build.yml'
  workflow_dispatch:

env:
  DSH_VERSION: v0.3.11
  DSH_PKG_VERSION: 0.2.1-rc.5
  APP_DIR: siyi-dsh-app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download DSH APK
        run: |
          set -e
          VER="${{ github.event.inputs.dsh_version || env.DSH_VERSION }}"
          URL="https://github.com/jackwener/DSH-Android/releases/download/${VER}/DSH-Android-${VER}-arm64.apk"
          echo "下载 $URL"
          curl -fL --retry 3 -o dsh.apk "$URL"
          ls -lh dsh.apk

      - name: Extract native libs
        run: |
          set -e
          mkdir -p "$APP_DIR/app/src/main/jniLibs/arm64-v8a"
          unzip -o -j dsh.apk \
            'lib/arm64-v8a/libnode.so' \
            'lib/arm64-v8a/libdshnode.so' \
            'lib/arm64-v8a/libc++_shared.so' \
            'lib/arm64-v8a/libdsh_flock.so' \
            -d "$APP_DIR/app/src/main/jniLibs/arm64-v8a"
          chmod 755 "$APP_DIR/app/src/main/jniLibs/arm64-v8a/"*.so
          ls -lh "$APP_DIR/app/src/main/jniLibs/arm64-v8a"

      - name: Extract engine.zip
        run: |
          set -e
          mkdir -p "$APP_DIR/app/src/main/assets"
          unzip -o -j dsh.apk 'assets/engine.zip' -d "$APP_DIR/app/src/main/assets"
          ls -lh "$APP_DIR/app/src/main/assets/engine.zip"

      - name: Build web profile
        run: |
          set -e
          PDIR="$APP_DIR/profile-build/profiles/web"
          mkdir -p "$PDIR"
          cp "$APP_DIR/app/src/main/assets/profile-template.json" "$PDIR/package.json"
          cd "$PDIR"
          npx --yes pnpm@11.28.9 add "@deepseek-ai/dsh-base@${DSH_PKG_VERSION}" "@deepseek-ai/dsh-web-app@${DSH_PKG_VERSION}" --config.node-linker=hoisted --config.package-import-method=copy --config.ignore-scripts=true
          WS="${GITHUB_WORKSPACE:-$PWD}"
          echo "WS=$WS"
          # Android 适配：三个关键包必须用引擎 APK 内的定制版
          # dsh-app-boot 双实例会让 settings 写入失败；node-addon-system 与
          # session-persistence-jsonl 的 npm 原版在 Android 上分别报 flock / link 错误。
          mkdir -p "$WS/engine-native"
          unzip -q -o "$WS/dsh.apk" "assets/engine.zip" -d "$WS/engine-native"
          unzip -q -o "$WS/engine-native/assets/engine.zip" -d "$WS/engine-native" "node_modules/@deepseek-ai/dsh-app-boot/*" "node_modules/@deepseek-ai/node-addon-system/*" "node_modules/@deepseek-ai/dsh-session-persistence-jsonl/*"
          for pkg in dsh-app-boot node-addon-system dsh-session-persistence-jsonl; do
            rm -rf "node_modules/@deepseek-ai/$pkg"
            cp -r "$WS/engine-native/node_modules/@deepseek-ai/$pkg" "node_modules/@deepseek-ai/$pkg"
            echo "unified $pkg"
          done
          echo "包数: $(ls node_modules/@deepseek-ai | wc -l)"
          echo "client-ui: $(ls node_modules/@deepseek-ai | grep -c client-ui || true)"
          ls -la "$WS/$APP_DIR/profile-build/profiles" || true
          # Android 侧只有 ZipInputStream，所以打成 zip 而不是 tgz
          cd "$WS/$APP_DIR/profile-build"
          zip -qr "$WS/$APP_DIR/app/src/main/assets/web-profile.zip" profiles
          cd - > /dev/null
          ls -lh "$WS/$APP_DIR/app/src/main/assets/web-profile.zip"

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: siyi-dsh-debug-apk
          path: ${{ env.APP_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
