# 模块说明：Automation Hub 回归测试门禁。

name: Automation Hub Regression

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - automation_hub/**
      - scripts/**
      - tests/**
      - .vscode/**
      - README.md
      - docs/**
      - 思忆集app/**
      - 思忆集项目学习笔记/**
      - requirements-desktop.txt
      - .vscode/tasks.json
  workflow_dispatch:
    inputs:
      mode:
        description: Release check mode to run
        required: true
        type: choice
        options:
          - smoke
          - regression
          - full
          - live
          - live-worker
          - artifact-cleanup-dry-run
          - artifact-cleanup
        default: regression
      live_api_base:
        description: API base URL for live mode
        required: false
        type: string
      live_worker_executor:
        description: Executor to verify in live-worker mode
        required: false
        type: choice
        options:
          - docker
          - host
        default: docker
      run_retention_days:
        description: Override run artifact retention days for cleanup modes
        required: false
        type: string
      proposal_retention_days:
        description: Override proposal artifact retention days for cleanup modes
        required: false
        type: string

jobs:
  legacy-venv-guard:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for legacy .venv references
        run: python scripts/check_legacy_venv_refs.py

  risk-config-audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit sensitive config changes
        shell: bash
        run: |
          python automation_hub/scripts/audit_risk_config_changes.py \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --head-ref "${{ github.event.pull_request.head.sha }}"

  helm-validate:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart with default values
        run: helm lint automation_hub/deploy/charts/automation-hub

      - name: Render chart with dev values
        run: helm template automation-hub-dev automation_hub/deploy/charts/automation-hub --values automation_hub/deploy/charts/automation_hub/values-dev.yaml > /tmp/automation-hub-dev.yaml

      - name: Render chart with prod values
        run: helm template automation-hub-prod automation_hub/deploy/charts/automation-hub --values automation_hub/deploy/charts/automation_hub/values-prod.yaml > /tmp/automation-hub-prod.yaml

      - name: Render chart with prod minimal values
        run: helm template automation-hub-prod-min automation_hub/deploy/charts/automation-hub --values automation_hub/deploy/charts/automation_hub/values-prod-minimal.yaml > /tmp/automation-hub-prod-minimal.yaml

      - name: Render chart with prod external redis values
        run: helm template automation-hub-prod-ext-redis automation_hub/deploy/charts/automation-hub --values automation_hub/deploy/charts/automation_hub/values-prod-external-redis.yaml > /tmp/automation-hub-prod-external-redis.yaml

      - name: Render chart with prod docker executor values
        run: helm template automation-hub-prod-docker automation_hub/deploy/charts/automation-hub --values automation_hub/deploy/charts/automation_hub/values-prod-docker-executor.yaml > /tmp/automation-hub-prod-docker-executor.yaml

  smoke:
    if: github.event_name == 'pull_request'
    needs: [risk-config-audit, legacy-venv-guard]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: automation_hub/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r automation_hub/requirements.txt

      - name: Run smoke check
        run: python automation_hub/scripts/release_check.py --mode smoke

  regression:
    if: github.event_name == 'push'
    needs: [legacy-venv-guard]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: automation_hub/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r automation_hub/requirements.txt

      - name: Run release check
        run: python automation_hub/scripts/release_check.py --mode regression

  manual:
    if: github.event_name == 'workflow_dispatch'
    needs: [legacy-venv-guard]
    runs-on: ubuntu-latest
    env:
      RELEASE_MODE: ${{ inputs.mode }}
      LIVE_API_BASE: ${{ inputs.live_api_base }}
      LIVE_WORKER_EXECUTOR: ${{ inputs.live_worker_executor }}
      LIVE_TOKEN: ${{ secrets.AUTOMATION_HUB_LIVE_TOKEN }}
      RUN_RETENTION_DAYS: ${{ inputs.run_retention_days }}
      PROPOSAL_RETENTION_DAYS: ${{ inputs.proposal_retention_days }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: automation_hub/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r automation_hub/requirements.txt

      - name: Validate manual live inputs
        if: env.RELEASE_MODE == 'live' || env.RELEASE_MODE == 'live-worker'
        shell: bash
        run: |
          if [ -z "$LIVE_API_BASE" ]; then
            echo "workflow_dispatch with mode=live/live-worker requires live_api_base input" >&2
            exit 1
          fi
          if [ -z "$LIVE_TOKEN" ]; then
            echo "workflow_dispatch with mode=live/live-worker requires repository secret AUTOMATION_HUB_LIVE_TOKEN" >&2
            exit 1
          fi

      - name: Prepare live token file
        if: env.RELEASE_MODE == 'live' || env.RELEASE_MODE == 'live-worker'
        shell: bash
        run: |
          printf '%s' "$LIVE_TOKEN" > automation_hub/.live_token

      - name: Run manual release check
        shell: bash
        run: |
          if [ "$RELEASE_MODE" = "live" ]; then
            python automation_hub/scripts/release_check.py --mode live --live-api-base "$LIVE_API_BASE" --live-token-file automation_hub/.live_token
          elif [ "$RELEASE_MODE" = "live-worker" ]; then
            python automation_hub/scripts/release_check.py --mode live-worker --live-api-base "$LIVE_API_BASE" --live-token-file automation_hub/.live_token --live-worker-executor "$LIVE_WORKER_EXECUTOR"
          elif [ "$RELEASE_MODE" = "artifact-cleanup-dry-run" ]; then
            cmd=(python automation_hub/scripts/cleanup_artifacts.py --dry-run)
            if [ -n "$RUN_RETENTION_DAYS" ]; then
              cmd+=(--run-retention-days "$RUN_RETENTION_DAYS")
            fi
            if [ -n "$PROPOSAL_RETENTION_DAYS" ]; then
              cmd+=(--proposal-retention-days "$PROPOSAL_RETENTION_DAYS")
            fi
            "${cmd[@]}"
          elif [ "$RELEASE_MODE" = "artifact-cleanup" ]; then
            cmd=(python automation_hub/scripts/cleanup_artifacts.py)
            if [ -n "$RUN_RETENTION_DAYS" ]; then
              cmd+=(--run-retention-days "$RUN_RETENTION_DAYS")
            fi
            if [ -n "$PROPOSAL_RETENTION_DAYS" ]; then
              cmd+=(--proposal-retention-days "$PROPOSAL_RETENTION_DAYS")
            fi
            "${cmd[@]}"
          else
            python automation_hub/scripts/release_check.py --mode "$RELEASE_MODE"
          fi

      - name: Cleanup live token file
        if: always() && (env.RELEASE_MODE == 'live' || env.RELEASE_MODE == 'live-worker')
        shell: bash
        run: rm -f automation_hub/.live_token