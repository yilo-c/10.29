# Automation Hub 示例配置（复制为 config.yaml 或设置 AUTOMATION_HUB_CONFIG 指向该文件）
# 注意：SMTP_PASSWORD 建议用环境变量注入，避免明文落盘。

notification:
  enabled: true

  # SMTP（推荐：587 + STARTTLS）
  smtp_host: smtp.qq.com
  smtp_port: 587
  smtp_user: "your_email@qq.com"
  smtp_password: ""  # 留空：建议用环境变量 SMTP_PASSWORD
  smtp_from: "your_email@qq.com"
  smtp_to:
    - "your_email@qq.com"

  # 可选：Webhook
  webhook_url: ""

  # 可选：Telegram
  telegram_token: ""
  telegram_chat_id: ""

# 可选：数据库（默认即可）
database:
  path: data/automation_hub.sqlite3

