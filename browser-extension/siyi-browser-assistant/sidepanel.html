<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>思忆集浏览器助手</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <main class="layout">
    <section class="panel">
      <header class="panel-header">
        <div class="brand-row">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l2.1 5.4 5.4 2.1-5.4 2.1L12 17.5l-2.1-5.4-5.4-2.1 5.4-2.1L12 2.5z"/><path d="M19 15.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9.9-2.1z"/></svg>
          </span>
          <div class="brand-copy">
            <p class="eyebrow">小问 in Browser</p>
            <h1>思忆集助手</h1>
          </div>
        </div>
        <div class="header-actions">
          <span id="bridge-status" class="pill">正在检查桌面连接</span>
          <button id="panel-close" class="icon-btn" title="收起侧栏" aria-label="收起侧栏">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </header>

      <nav class="tool-bar" aria-label="快捷操作">
        <button id="summarize-page" class="tool-icon" title="总结当前页面" aria-label="总结当前页面">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l1.5 3.9L17.5 9.4l-4 1.5L12 15l-1.5-4.1-4-1.5 4-1.5L12 4z"/><path d="M18.5 14.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8.8-2z"/></svg>
        </button>
        <button id="summarize-selection" class="tool-icon" title="总结选中内容" aria-label="总结选中内容">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.6"/><circle cx="6" cy="18" r="2.6"/><path d="M8.3 7.6L20 19M8.3 16.4L20 5"/></svg>
        </button>
        <button id="capture-page" class="tool-icon" title="存到收件箱" aria-label="存到收件箱">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h4.5l2 3h5l2-3H21"/><path d="M5 5h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z"/></svg>
        </button>
        <button id="save-reading" class="tool-icon" title="保存到阅读列表" aria-label="保存到阅读列表">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V6a2 2 0 012-2h5v16H6a2 2 0 01-2-2z"/><path d="M20 19V6a2 2 0 00-2-2h-5v16h5a2 2 0 002-2z"/></svg>
        </button>
        <button id="save-bookmark" class="tool-icon" title="加入书签" aria-label="加入书签">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h10a1 1 0 011 1V21l-6-4.2L6 21V4.5a1 1 0 011-1z"/></svg>
        </button>
        <button id="create-note" class="tool-icon" title="转成笔记" aria-label="转成笔记">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="M13.8 4.7l5.5 5.5L10 19.5H4.5V14L13.8 4.7z"/></svg>
        </button>
        <button id="create-task" class="tool-icon" title="生成任务" aria-label="生成任务">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.5"/></svg>
        </button>
        <button id="import-kimi" class="tool-icon" title="导入 Kimi 对话" aria-label="导入 Kimi 对话" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 119.5 3.5a7 7 0 0011 11z"/></svg>
        </button>
        <button id="import-deepseek" class="tool-icon" title="导入 DeepSeek 对话" aria-label="导入 DeepSeek 对话" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1116 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5z"/><path d="M8.5 11h.01M15.5 11h.01"/><path d="M9 15.5c1 .8 2 .8 3 0s2-.8 3 0"/></svg>
        </button>
      </nav>

      <details class="debug-panel" id="debug-panel">
        <summary>
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          页面诊断
        </summary>
        <div class="debug-grid" id="debug-grid">
          <div class="debug-card">
            <strong>字幕状态</strong>
            <span id="debug-subtitle-status">未读取</span>
          </div>
          <div class="debug-card">
            <strong>内容置信度</strong>
            <span id="debug-content-confidence">-</span>
          </div>
          <div class="debug-card">
            <strong>噪声评分</strong>
            <span id="debug-noise-score">-</span>
          </div>
          <div class="debug-card">
            <strong>主提取节点</strong>
            <span id="debug-root-hint">-</span>
          </div>
          <div class="debug-card">
            <strong>简介长度</strong>
            <span id="debug-description-length">0</span>
          </div>
          <div class="debug-card">
            <strong>字幕长度</strong>
            <span id="debug-subtitle-length">0</span>
          </div>
          <div class="debug-card">
            <strong>正文长度</strong>
            <span id="debug-page-length">0</span>
          </div>
          <div class="debug-card">
            <strong>摘要模式</strong>
            <span id="debug-summary-mode">未总结</span>
          </div>
          <div class="debug-card">
            <strong>Fetch方式</strong>
            <span id="debug-fetch-method">-</span>
          </div>
          <div class="debug-card">
            <strong>Fetch错误</strong>
            <span id="debug-fetch-error">无</span>
          </div>
          <div class="debug-card">
            <strong>字幕语言</strong>
            <span id="debug-subtitle-lan">-</span>
          </div>
        </div>
        <p id="debug-warning" class="debug-warning">尚未读取页面上下文。</p>
      </details>

      <!-- ===== 结果展示区 ===== -->
      <section id="result-view" class="result-view" hidden>
        <nav class="result-view-switcher" id="result-view-switcher">
          <button class="rv-tab active" data-rv="summary">重点摘要</button>
          <button class="rv-tab" data-rv="subtitle">文本字幕</button>
        </nav>

        <!-- 总结卡片 -->
        <article id="rv-summary-panel" class="rv-panel rv-summary-panel">
          <p id="rv-summary-conclusion" class="rv-conclusion"></p>
          <ol id="rv-summary-points" class="rv-points"></ol>
          <p id="rv-summary-next" class="rv-next"></p>
          <footer class="rv-source-bar">
            <span id="rv-source-label" class="rv-source-label"></span>
            <span id="rv-summary-type-pill" class="rv-evidence-pill"></span>
            <span id="rv-subtitle-status-pill" class="rv-evidence-pill"></span>
            <span id="rv-text-length-pill" class="rv-evidence-pill"></span>
          </footer>
        </article>

        <!-- CC字幕视图 -->
        <article id="rv-subtitle-panel" class="rv-panel rv-subtitle-panel" hidden>
          <div class="subtitle-meta-bar" id="subtitle-meta-bar">
            <span id="subtitle-meta-source"></span>
            <span id="subtitle-meta-lang"></span>
            <span id="subtitle-meta-length"></span>
            <button id="subtitle-copy-btn" class="copy-btn" title="复制字幕文本">复制</button>
          </div>
          <div id="rv-subtitle-text" class="rv-subtitle-text"></div>
        </article>
      </section>

      <section class="chat-shell">
        <div id="chat-messages" class="chat-messages" aria-live="polite"></div>
        <div id="chat-suggestions" class="chat-suggestions"></div>
      </section>

      <footer class="composer-wrap">
        <div class="composer-row">
          <input id="chat-input" class="chat-input" type="text" placeholder="问我：总结这页重点、给出下一步，或直接转笔记/任务" />
          <button id="chat-send" class="send-btn" title="发送" aria-label="发送">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5.5 11.5L12 5l6.5 6.5"/></svg>
          </button>
        </div>
      </footer>
    </section>

    <section class="legacy-cache" aria-hidden="true">
      <p id="page-meta"></p>
      <pre id="summary-output"></pre>
      <ul id="key-points"></ul>
      <ul id="action-hints"></ul>
      <ul id="context-suggestions"></ul>
      <div id="recommended-actions"></div>
      <span id="context-kind-pill"></span>
      <span id="context-mode-pill"></span>
      <div id="context-top-action"></div>
      <div id="context-chips"></div>
      <div id="context-signals"></div>
      <input id="bridge-base-input" type="text" />
      <p id="bridge-help"></p>
      <p id="bridge-last-check"></p>
      <ul id="workspace-overview"></ul>
      <ul id="bridge-tips"></ul>
      <ul id="bridge-history"></ul>
      <button id="run-diagnostics" type="button"></button>
      <button id="refresh-status" type="button"></button>
      <button id="open-settings" type="button"></button>
      <button id="save-bridge-base" type="button"></button>
      <button id="reset-bridge-base" type="button"></button>
    </section>
  </main>
  <script src="bridge-utils.js"></script>
  <script src="bridge-auth.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
