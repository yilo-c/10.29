<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小问 Canvas Rig 原型 — AI 控制身体演示</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d1117; color: #e6edf3; font-family: system-ui, sans-serif;
  display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden;
}
.container { display: flex; gap: 32px; align-items: flex-start; padding: 24px; }
/* Canvas area */
.canvas-wrap {
  position: relative; background: rgba(255,255,255,0.03); border-radius: 20px;
  border: 1px solid rgba(121,207,255,0.15); padding: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 0 80px rgba(90,190,255,0.03);
}
canvas { display: block; border-radius: 12px; cursor: pointer; }
canvas:active { cursor: grabbing; }
/* Info panel */
.panel {
  width: 360px; max-height: 600px; overflow-y: auto;
  background: rgba(255,255,255,0.03); border-radius: 16px;
  border: 1px solid rgba(121,207,255,0.12); padding: 20px;
  font-size: 13px; line-height: 1.6;
}
.panel h2 { font-size: 14px; color: #79cfff; margin-bottom: 12px; font-weight: 600; letter-spacing: 0.3px; }
.panel h3 { font-size: 12px; color: #8b949e; margin: 12px 0 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.ai-row { display: flex; justify-content: space-between; padding: 2px 0; }
.ai-row .label { color: #8b949e; }
.ai-row .value { color: #e6edf3; font-weight: 500; }
.candidate { padding: 4px 8px; margin: 2px 0; border-radius: 6px; font-size: 12px; }
.candidate.selected { background: rgba(121,207,255,0.12); border-left: 2px solid #79cfff; }
.candidate .bar { display: inline-block; height: 4px; border-radius: 2px; margin-left: 8px; vertical-align: middle; transition: width 0.3s; }
/* Mode buttons */
.modes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.mode-btn {
  padding: 4px 12px; border-radius: 12px; border: 1px solid rgba(121,207,255,0.2);
  background: transparent; color: #c9d1d9; font-size: 11px; cursor: pointer; transition: all 0.2s;
}
.mode-btn:hover { border-color: #79cfff; color: #fff; }
.mode-btn.active { background: rgba(121,207,255,0.15); border-color: #79cfff; color: #79cfff; }
/* Status bar */
.status-bar { display: flex; gap: 12px; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 11px; color: #8b949e; }
.status-bar span { display: flex; align-items: center; gap: 4px; }
.dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.dot.green { background: #3fb950; }
.dot.yellow { background: #d29922; }
.dot.purple { background: #bc8cff; }
/* History */
.history { margin-top: 12px; max-height: 120px; overflow-y: auto; font-size: 11px; color: #8b949e; }
.history div { padding: 1px 0; opacity: 0.8; }
.history .now { color: #79cfff; opacity: 1; }
/* particle toggle */
.toggle { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 11px; color: #8b949e; cursor: pointer; }
.toggle input { accent-color: #79cfff; }
</style>
</head>
<body>
<div class="container">
  <div class="canvas-wrap">
    <canvas id="petCanvas" width="400" height="400"></canvas>
    <div style="text-align:center;margin-top:12px;font-size:11px;color:#8b949e;">
      ← 点击小问互动 · 拖拽移动 · 切换模式看 AI 决策 →
    </div>
  </div>

  <div class="panel" id="panel">
    <h2>🧠 小问 AI 决策层</h2>

    <h3>当前场景</h3>
    <div id="sceneDisplay">
      <div class="ai-row"><span class="label">时间</span><span class="value" id="sceneTime">--</span></div>
      <div class="ai-row"><span class="label">用户操作</span><span class="value" id="sceneAction">无</span></div>
      <div class="ai-row"><span class="label">情绪</span><span class="value" id="sceneMood">平静</span></div>
      <div class="ai-row"><span class="label">能量</span><span class="value" id="sceneEnergy">100%</span></div>
    </div>

    <h3>AI 候选动作</h3>
    <div id="candidates"></div>

    <h3>决策输出</h3>
    <div id="decisionDisplay">
      <div class="ai-row"><span class="label">选中动作</span><span class="value" id="selectedAction">--</span></div>
      <div class="ai-row"><span class="label">置信度</span><span class="value" id="confidence">--</span></div>
      <div class="ai-row"><span class="label">混合权重</span><span class="value" id="blendWeight">--</span></div>
      <div class="ai-row"><span class="label">过渡进度</span><span class="value" id="transitionProgress">--</span></div>
      <div class="ai-row"><span class="label">帧率</span><span class="value" id="fpsDisplay">--</span></div>
    </div>

    <h3>AI 人格模式</h3>
    <div class="modes" id="modeButtons">
      <button class="mode-btn active" data-mode="normal">🎯 正常</button>
      <button class="mode-btn" data-mode="playful">🌸 活泼</button>
      <button class="mode-btn" data-mode="lazy">😴 慵懒</button>
      <button class="mode-btn" data-mode="alert">⚡ 警觉</button>
    </div>

    <div class="toggle">
      <input type="checkbox" id="showParticles" checked>
      <label for="showParticles">显示粒子特效</label>
    </div>

    <div class="history" id="historyLog"></div>

    <div class="status-bar">
      <span><span class="dot green"></span> AI 驱动</span>
      <span id="poseStatus">姿态: idle</span>
      <span id="frameStatus">帧: 0/0</span>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// 1. 姿态配置 — 使用现有 PNG 帧作为"姿态空间"
// ═══════════════════════════════════════════════════════
const POSE_LIBRARY = {
  idle: {
    label: '待机',
    frames: Array.from({length:4}, (_,i) => `pet/xiaowen/frames/idle/idle_${String(i+1).padStart(2,'0')}.png`),
    fps: 6, loop: true,
    tags: ['calm', 'neutral'],
    energy: 0.3, // 能量消耗
  },
  clickDefend: {
    label: '受惊',
    frames: Array.from({length:7}, (_,i) => `pet/xiaowen/frames/click_defend/click_defend_${String(i+1).padStart(2,'0')}.png`),
    fps: 12, loop: false,
    tags: ['surprise', 'defense'],
    energy: 0.6,
  },
  shy: {
    label: '害羞',
    frames: Array.from({length:4}, (_,i) => `pet/xiaowen/frames/shy/shy_${String(i+1).padStart(2,'0')}.png`),
    fps: 8, loop: false,
    tags: ['happy', 'shy'],
    energy: 0.4,
  },
  land: {
    label: '落地',
    frames: Array.from({length:6}, (_,i) => `pet/xiaowen/frames/land/land_${String(i+1).padStart(2,'0')}.png`),
    fps: 10, loop: false,
    tags: ['movement', 'impact'],
    energy: 0.5,
  },
}

// Fallback
const FALLBACK_IMG = 'pet/xiaowen_fullbody.png'
const SPRITE_IDLE = 'pet/sprite_idle.png'

// ═══════════════════════════════════════════════════════
// 2. 图像加载器
// ═══════════════════════════════════════════════════════
const imageCache = {}
let allLoaded = false
let totalImages = 0
let loadedImages = 0

function preloadImages(callback) {
  const allSrcs = [FALLBACK_IMG, SPRITE_IDLE]
  for (const pose of Object.values(POSE_LIBRARY)) {
    allSrcs.push(...pose.frames)
  }
  totalImages = allSrcs.length
  loadedImages = 0

  for (const src of allSrcs) {
    const img = new Image()
    img.onload = () => { loadedImages++; if (loadedImages >= totalImages) { allLoaded = true; callback?.() } }
    img.onerror = () => { loadedImages++; if (loadedImages >= totalImages) { allLoaded = true; callback?.() } }
    img.src = src
    imageCache[src] = img
  }
}

// ═══════════════════════════════════════════════════════
// 3. Canvas Rig 引擎
// ═══════════════════════════════════════════════════════
const canvas = document.getElementById('petCanvas')
const ctx = canvas.getContext('2d')
const W = 400, H = 400
const CHAR_SIZE = 256

// --- 当前姿态状态 ---
let currentState = {
  poseName: 'idle',
  frameIndex: 0,
  frameTimer: 0,
  // 过渡
  transitioning: false,
  fromPose: null,        // { poseName, frameIndex }
  toPose: 'idle',
  transitionProgress: 0,  // 0-1
  // rig 参数 (AI 控制的"身体"参数)
  rig: {
    bodySway: 0,       // -0.03 ~ 0.03 rad
    headTilt: 0,       // -0.05 ~ 0.05 rad
    breathePhase: 0,
    floatY: 0,
    scale: 1,
    shadowAlpha: 0.25,
  },
  // 目标 rig 参数 (用于平滑插值)
  rigTarget: { bodySway:0, headTilt:0, breathePhase:0, floatY:0, scale:1, shadowAlpha:0.25 },
}

// 点击/拖拽状态
let mouseDown = false
let mouseStart = { x:0, y:0 }
let isDragging = false
let petX = 72, petY = 72 // 在 canvas 中的位置

// ═══════════════════════════════════════════════════════
// 4. AI 决策引擎
// ═══════════════════════════════════════════════════════
const AI = {
  mode: 'normal', // normal | playful | lazy | alert
  mood: 'calm',
  energy: 1.0,
  lastUserAction: 'none',
  userActionTimer: 0,
  sceneContext: { time: 'day', hour: 14 },
  // 决策历史
  history: [],
  decision: null,
  candidates: [],

  // 场景感知
  updateScene() {
    const now = new Date()
    const h = now.getHours()
    this.sceneContext.hour = h
    this.sceneContext.time = h < 6 ? 'night' : h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening'
    // 能量随时间变化
    const baseEnergy = h >= 23 || h < 6 ? 0.3 : h >= 13 && h <= 15 ? 0.5 : 0.9
    this.energy += (baseEnergy - this.energy) * 0.01

    // 用户操作超时重置
    this.userActionTimer++
    if (this.userActionTimer > 300) { // ~5s 无操作
      this.lastUserAction = 'none'
    }
  },

  // 根据场景选择姿态的核心 AI 逻辑
  decidePose() {
    const ctx = this.sceneContext
    const mode = this.mode
    const candidates = []
    const now = currentState

    for (const [name, pose] of Object.entries(POSE_LIBRARY)) {
      let score = 0

      // === 场景权重 ===
      // 1. 最近有用户操作 → 偏向交互类动作
      if (this.lastUserAction !== 'none') {
        if (name === 'clickDefend' && this.lastUserAction === 'click') score += 0.8
        else if (name === 'shy' && this.lastUserAction === 'doubleClick') score += 0.8
        else if (name === 'land' && this.lastUserAction === 'dragEnd') score += 0.9
      }

      // 2. 默认倾向 idle
      if (name === 'idle') score += 0.4

      // 3. 根据 AI 人格调整
      if (mode === 'playful') {
        if (name === 'shy') score += 0.3
        if (name === 'clickDefend') score += 0.2
      } else if (mode === 'lazy') {
        if (name === 'idle') score += 0.4
        if (name === 'clickDefend') score -= 0.2
      } else if (mode === 'alert') {
        if (name === 'clickDefend') score += 0.4
        if (name === 'idle') score -= 0.1
      }

      // 4. 能量水平影响
      if (this.energy < 0.3 && name !== 'idle') score -= 0.2

      // 5. 非循环动作刚播完不加分
      if (!pose.loop && now.poseName === name && now.frameIndex >= pose.frames.length - 1) {
        score -= 0.5
      }

      // 6. 随机微扰动 (让行为不机械)
      score += Math.random() * 0.15

      candidates.push({ name, label: pose.label, score, frames: pose.frames, ...pose })
    }

    // 排序取 top 3
    candidates.sort((a, b) => b.score - a.score)
    const top3 = candidates.slice(0, 3)

    // 选最高分，但如果最高分和当前一样且不是 loop 动作，考虑换
    const best = top3[0]
    if (best.name === now.poseName && !best.loop && now.frameIndex >= best.frames.length - 1) {
      // 当前非循环动作播完了，换第二选择
      const second = top3[1]
      if (second && second.score > 0.1) {
        this.decision = second
      } else {
        this.decision = { name: 'idle', label: '待机', ...POSE_LIBRARY.idle }
      }
    } else {
      this.decision = best || { name: 'idle', label: '待机', ...POSE_LIBRARY.idle }
    }

    // 如果正在过渡中，不要频繁切换
    if (currentState.transitioning && currentState.transitionProgress < 0.5) {
      // 保持当前目标
      this.decision = { name: currentState.toPose, label: POSE_LIBRARY[currentState.toPose]?.label || '待机', ...POSE_LIBRARY[currentState.toPose] }
    }

    this.candidates = top3
    return this.decision.name
  },

  // 生成 rig 参数 (AI 控制身体的"微表情")
  generateRigParams(poseName) {
    const t = Date.now() / 1000
    const mode = this.mode
    const base = {
      bodySway: Math.sin(t * 0.8) * 0.015,
      headTilt: Math.sin(t * 1.2 + 1) * 0.01,
      floatY: Math.sin(t * 1.5) * 2,
      scale: 1,
      shadowAlpha: 0.25,
    }

    // 不同模式调整呼吸/浮动参数
    if (mode === 'playful') {
      base.bodySway = Math.sin(t * 1.6) * 0.02
      base.floatY = Math.sin(t * 2.0) * 3
      base.scale = 1 + Math.sin(t * 0.5) * 0.01
    } else if (mode === 'lazy') {
      base.bodySway = Math.sin(t * 0.4) * 0.01
      base.floatY = Math.sin(t * 0.6) * 1
      base.shadowAlpha = 0.35
    } else if (mode === 'alert') {
      base.bodySway = Math.sin(t * 2.0) * 0.008
      base.headTilt = Math.sin(t * 1.8) * 0.02
      base.shadowAlpha = 0.15
    }

    // 不同姿态额外调整
    if (poseName === 'clickDefend') {
      base.bodySway = -0.03 // 后仰
      base.scale = 0.97
    } else if (poseName === 'shy') {
      base.headTilt = -0.03
      base.floatY = -2
    } else if (poseName === 'land') {
      base.bodySway = Math.sin(t * 3) * 0.025 // 落地站稳
    }

    return base
  }
}

// ═══════════════════════════════════════════════════════
// 5. 动画渲染循环
// ═══════════════════════════════════════════════════════
let lastTime = 0
let frameCount = 0
let fpsTimer = 0
let currentFps = 0
let historyLog = []

function lerp(a, b, t) { return a + (b - a) * t }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)) }

function animate(timestamp) {
  const dt = lastTime ? Math.min(timestamp - lastTime, 50) : 16
  lastTime = timestamp
  const dtSec = dt / 1000

  // FPS
  frameCount++
  fpsTimer += dt
  if (fpsTimer >= 1000) {
    currentFps = frameCount
    frameCount = 0
    fpsTimer = 0
  }

  // ── AI 场景更新 ──
  AI.updateScene()
  AI.decidePose()

  const targetPose = AI.decision.name

  // ── 姿态过渡管理 ──
  if (currentState.toPose !== targetPose && !currentState.transitioning) {
    // 开始新过渡
    currentState.fromPose = {
      poseName: currentState.poseName,
      frameIndex: currentState.frameIndex,
    }
    currentState.toPose = targetPose
    currentState.transitioning = true
    currentState.transitionProgress = 0
  }

  if (currentState.transitioning) {
    // 过渡速度: 0.03~0.06 per frame ≈ 16-33 frames ≈ 0.3-0.5s
    currentState.transitionProgress = Math.min(1, currentState.transitionProgress + 0.04)

    if (currentState.transitionProgress >= 1) {
      currentState.transitioning = false
      currentState.poseName = currentState.toPose
      currentState.frameIndex = 0
      currentState.frameTimer = 0
      // 记录历史
      addHistory(`切换姿态: ${POSE_LIBRARY[currentState.poseName]?.label || currentState.poseName}`)
    }
  } else {
    // 不在过渡中，正常播放帧
    currentState.poseName = currentState.toPose
  }

  // ── 帧播放 ──
  const pose = POSE_LIBRARY[currentState.poseName]
  if (pose) {
    const frameDuration = 1000 / pose.fps
    currentState.frameTimer += dt
    if (currentState.frameTimer >= frameDuration) {
      currentState.frameTimer = 0
      currentState.frameIndex++
      if (currentState.frameIndex >= pose.frames.length) {
        currentState.frameIndex = pose.loop ? 0 : pose.frames.length - 1
      }
    }
  }

  // ── AI 生成 rig 参数 (身体控制) ──
  const rigTarget = AI.generateRigParams(currentState.poseName)
  const rig = currentState.rig
  const smoothFactor = 0.08 // 平滑跟随速度
  rig.bodySway = lerp(rig.bodySway, rigTarget.bodySway, smoothFactor)
  rig.headTilt = lerp(rig.headTilt, rigTarget.headTilt, smoothFactor)
  rig.floatY = lerp(rig.floatY, rigTarget.floatY, smoothFactor)
  rig.scale = lerp(rig.scale, rigTarget.scale, smoothFactor)
  rig.shadowAlpha = lerp(rig.shadowAlpha, rigTarget.shadowAlpha, smoothFactor)

  // ── 绘制 ──
  ctx.clearRect(0, 0, W, H)

  // 背景氛围
  ctx.fillStyle = 'rgba(9, 18, 29, 0.6)'
  ctx.fillRect(0, 0, W, H)

  // 地面微光
  const grad = ctx.createRadialGradient(W/2, H-20, 0, W/2, H-20, 120)
  grad.addColorStop(0, 'rgba(121, 207, 255, 0.04)')
  grad.addColorStop(1, 'rgba(121, 207, 255, 0)')
  ctx.fillStyle = grad
  ctx.fillRect(0, 0, W, H)

  ctx.save()
  // 整体偏移到画布中央 + rig 浮动
  const cx = W/2 - CHAR_SIZE/2 + petX - 72
  const cy = H/2 - CHAR_SIZE/2 + petY - 72 + rig.floatY
  ctx.translate(cx + CHAR_SIZE/2, cy + CHAR_SIZE/2)

  // rig: 身体摇摆
  ctx.rotate(rig.bodySway)

  // rig: 缩放 (呼吸)
  const s = rig.scale
  ctx.scale(s, s)

  // rig: 头部倾斜 (模拟头转)
  // 通过旋转上半部分来实现 - 但图片是整体，只能整体效果
  ctx.translate(-CHAR_SIZE/2, -CHAR_SIZE/2)

  // ── 阴影 ──
  ctx.save()
  ctx.shadowColor = `rgba(0, 0, 0, ${rig.shadowAlpha})`
  ctx.shadowBlur = 12
  ctx.shadowOffsetY = 4
  ctx.shadowOffsetX = 0
  ctx.restore()

  // ── 绘制当前帧 ──
  let img = null
  if (pose) {
    const frameSrc = pose.frames[currentState.frameIndex]
    img = imageCache[frameSrc]
  }
  // fallback
  if (!img || !img.complete || img.naturalWidth === 0) {
    img = imageCache[FALLBACK_IMG] || imageCache[SPRITE_IDLE]
  }

  if (img && img.complete && img.naturalWidth > 0) {
    if (currentState.transitioning && currentState.fromPose) {
      // ── 过渡绘制: 双帧混合 ──
      const fromPoseDef = POSE_LIBRARY[currentState.fromPose.poseName]
      const fromFrameSrc = fromPoseDef?.frames[currentState.fromPose.frameIndex]
      const fromImg = fromFrameSrc ? imageCache[fromFrameSrc] : null

      const progress = easeInOut(currentState.transitionProgress)

      if (fromImg && fromImg.complete && fromImg.naturalWidth > 0) {
        // 旧帧淡出
        ctx.globalAlpha = 1 - progress
        drawFrame(ctx, fromImg, CHAR_SIZE, CHAR_SIZE)
      }

      // 新帧淡入
      ctx.globalAlpha = progress
      drawFrame(ctx, img, CHAR_SIZE, CHAR_SIZE)
      ctx.globalAlpha = 1
    } else {
      // 正常绘制
      drawFrame(ctx, img, CHAR_SIZE, CHAR_SIZE)
    }
  }

  // 拖拽尾迹粒子
  if (isDragging && document.getElementById('showParticles').checked) {
    drawFlightParticles(ctx, CHAR_SIZE, timestamp)
  }

  // 剑意粒子 (idle 时轻微)
  if (document.getElementById('showParticles').checked && !isDragging && currentState.poseName === 'idle') {
    drawMistParticles(ctx, CHAR_SIZE, timestamp)
  }

  ctx.restore()

  // ── UI 更新 ──
  updateUI()

  requestAnimationFrame(animate)
}

// 缓动函数
function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t
}

function drawFrame(ctx, img, w, h) {
  const iw = img.naturalWidth || img.width
  const ih = img.naturalHeight || img.height
  const fitSize = w * 0.92
  const scale = Math.min(fitSize / iw, fitSize / ih)
  const dw = iw * scale
  const dh = ih * scale
  const dx = (w - dw) / 2
  const dy = (h - dh) / 2

  ctx.shadowColor = 'rgba(0,0,0,0.2)'
  ctx.shadowBlur = 8
  ctx.shadowOffsetX = 0
  ctx.shadowOffsetY = 3
  ctx.drawImage(img, dx, dy, dw, dh)
  ctx.shadowColor = 'transparent'
}

// ── 飞行粒子 ──
let flyParticles = []
let mistParticles = []

function drawFlightParticles(ctx, size, timestamp) {
  const t = timestamp / 1000
  flyParticles.push({
    x: size * 0.2 + Math.random() * size * 0.6,
    y: size * 0.7 + Math.random() * size * 0.2,
    vx: (Math.random() - 0.5) * 0.5,
    vy: -Math.random() * 1 - 0.5,
    life: 0,
    maxLife: 30 + Math.random() * 20,
    size: 2 + Math.random() * 3,
  })

  for (let i = flyParticles.length - 1; i >= 0; i--) {
    const p = flyParticles[i]
    p.x += p.vx
    p.y += p.vy
    p.life++
    const alpha = 0.4 * (1 - p.life / p.maxLife)
    ctx.beginPath()
    ctx.arc(p.x, p.y, p.size * (1 - p.life / p.maxLife * 0.5), 0, Math.PI * 2)
    ctx.fillStyle = `rgba(180, 220, 255, ${alpha})`
    ctx.fill()
    if (p.life >= p.maxLife) flyParticles.splice(i, 1)
  }
}

function drawMistParticles(ctx, size, timestamp) {
  const t = timestamp / 1000
  if (Math.random() < 0.05) {
    mistParticles.push({
      x: size * 0.1 + Math.random() * size * 0.8,
      y: size * 0.8 + Math.random() * size * 0.15,
      vx: (Math.random() - 0.5) * 0.2,
      vy: -Math.random() * 0.3 - 0.1,
      life: 0,
      maxLife: 40 + Math.random() * 30,
      size: 3 + Math.random() * 4,
    })
  }

  for (let i = mistParticles.length - 1; i >= 0; i--) {
    const p = mistParticles[i]
    p.x += p.vx
    p.y += p.vy
    p.life++
    const alpha = 0.3 * (1 - p.life / p.maxLife)
    ctx.beginPath()
    ctx.arc(p.x, p.y, p.size * (1 - p.life / p.maxLife * 0.6), 0, Math.PI * 2)
    ctx.fillStyle = `rgba(200, 230, 255, ${alpha})`
    ctx.fill()
    if (p.life >= p.maxLife) mistParticles.splice(i, 1)
  }
}

// ═══════════════════════════════════════════════════════
// 6. 交互
// ═══════════════════════════════════════════════════════
canvas.addEventListener('mousedown', (e) => {
  mouseDown = true
  mouseStart = { x: e.clientX, y: e.clientY }
})

canvas.addEventListener('mousemove', (e) => {
  if (!mouseDown) return
  const dx = e.clientX - mouseStart.x
  const dy = e.clientY - mouseStart.y
  if (dx * dx + dy * dy > 64) {
    if (!isDragging) {
      isDragging = true
      AI.lastUserAction = 'dragStart'
      AI.userActionTimer = 0
      addHistory('用户拖拽 → 触发 dragFly 姿态')
    }
    petX += dx * 0.5
    petY += dy * 0.5
    mouseStart = { x: e.clientX, y: e.clientY }
  }
})

canvas.addEventListener('mouseup', () => {
  if (isDragging) {
    isDragging = false
    AI.lastUserAction = 'dragEnd'
    AI.userActionTimer = 0
    addHistory('拖拽结束 → 触发 land 姿态')
  }
  mouseDown = false
})

canvas.addEventListener('click', (e) => {
  if (isDragging) return
  AI.lastUserAction = 'click'
  AI.userActionTimer = 0
  addHistory('用户单击 → AI 选择受惊姿态')
})

canvas.addEventListener('dblclick', () => {
  AI.lastUserAction = 'doubleClick'
  AI.userActionTimer = 0
  addHistory('用户双击 → AI 选择害羞姿态')
})

// ═══════════════════════════════════════════════════════
// 7. UI 更新
// ═══════════════════════════════════════════════════════
function addHistory(msg) {
  const now = new Date()
  const t = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`
  historyLog.unshift(`[${t}] ${msg}`)
  if (historyLog.length > 20) historyLog.pop()
}

function updateUI() {
  const ctx = AI.sceneContext
  document.getElementById('sceneTime').textContent =
    `${ctx.hour}:00 · ${ctx.time === 'morning' ? '早晨' : ctx.time === 'afternoon' ? '下午' : ctx.time === 'evening' ? '傍晚' : '深夜'}`
  document.getElementById('sceneAction').textContent =
    AI.lastUserAction === 'none' ? '无操作' :
    AI.lastUserAction === 'click' ? '单击' :
    AI.lastUserAction === 'doubleClick' ? '双击' :
    AI.lastUserAction === 'dragStart' ? '拖拽中' :
    AI.lastUserAction === 'dragEnd' ? '拖拽结束' : AI.lastUserAction
  document.getElementById('sceneMood').textContent =
    AI.mode === 'normal' ? '平静' : AI.mode === 'playful' ? '活泼' : AI.mode === 'lazy' ? '慵懒' : '警觉'
  document.getElementById('sceneEnergy').textContent = Math.round(AI.energy * 100) + '%'

  // 候选
  const candDiv = document.getElementById('candidates')
  let candHtml = ''
  const maxScore = AI.candidates[0]?.score || 1
  for (const c of AI.candidates) {
    const isSelected = c.name === AI.decision?.name
    const barW = (c.score / maxScore) * 100
    const barColor = isSelected ? '#79cfff' : '#30363d'
    candHtml += `<div class="candidate ${isSelected ? 'selected' : ''}">
      <span style="display:flex;justify-content:space-between">
        <span>${c.label}</span>
        <span style="color:#8b949e">${c.score.toFixed(2)}</span>
      </span>
      <span class="bar" style="width:${barW}%;background:${barColor}"></span>
    </div>`
  }
  candDiv.innerHTML = candHtml

  // 决策
  const d = AI.decision
  if (d) {
    document.getElementById('selectedAction').textContent = d.label || d.name
    document.getElementById('confidence').textContent = (d.score || 0).toFixed(2)
    document.getElementById('blendWeight').textContent =
      currentState.transitioning ? `${(1 - currentState.transitionProgress).toFixed(2)} → ${currentState.transitionProgress.toFixed(2)}` : '1.00'
    document.getElementById('transitionProgress').textContent =
      currentState.transitioning ? Math.round(currentState.transitionProgress * 100) + '%' : '—'
  }
  document.getElementById('fpsDisplay').textContent = currentFps + ' fps'

  // 状态
  const poseLabel = POSE_LIBRARY[currentState.poseName]?.label || currentState.poseName
  document.getElementById('poseStatus').textContent = `姿态: ${poseLabel}`
  const pose2 = POSE_LIBRARY[currentState.poseName]
  document.getElementById('frameStatus').textContent =
    `帧: ${currentState.frameIndex + 1}/${pose2?.frames?.length || 0}${currentState.transitioning ? ' 🌀' : ''}`

  // 历史
  const histDiv = document.getElementById('historyLog')
  histDiv.innerHTML = historyLog.map((h, i) => `<div class="${i === 0 ? 'now' : ''}">${h}</div>`).join('')
}

// ═══════════════════════════════════════════════════════
// 8. 模式切换
// ═══════════════════════════════════════════════════════
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'))
    btn.classList.add('active')
    AI.mode = btn.dataset.mode
    addHistory(`AI 人格切换: ${btn.textContent.trim()}`)
  })
})

  addHistory('AI 决策引擎启动')
  addHistory('Canvas Rig 渲染引擎启动')

})
