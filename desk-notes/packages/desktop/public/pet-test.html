<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>小问桌宠 - 帧动画测试</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: system-ui, sans-serif;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 { margin-bottom: 30px; color: #79cfff; font-size: 24px; }
    .canvas-container {
      background: rgba(121, 207, 255, 0.08);
      border: 2px dashed rgba(121, 207, 255, 0.3);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 30px;
    }
    canvas { display: block; }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 600px;
    }
    button {
      padding: 10px 20px;
      background: rgba(121, 207, 255, 0.15);
      border: 1px solid rgba(121, 207, 255, 0.4);
      color: #79cfff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    button:hover { background: rgba(121, 207, 255, 0.25); }
    button.active { background: #79cfff; color: #1a1a2e; }
    .info {
      background: rgba(255, 255, 255, 0.05);
      padding: 16px 24px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.8;
      max-width: 500px;
    }
    .fps-control {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
    }
    .fps-control input { width: 60px; }
    .frame-counter {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.6);
      padding: 8px 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>🎴 小问桌宠帧动画测试</h1>

  <div class="frame-counter" id="frameCounter">frame: 0 / 0</div>

  <div class="canvas-container">
    <canvas id="petCanvas" width="256" height="256"></canvas>
  </div>

  <div class="controls">
    <button onclick="playClip('idle', true)" class="active">▶ idle (6fps loop)</button>
    <button onclick="playClip('clickDefend', false)">▶ clickDefend (12fps once)</button>
    <button onclick="togglePause()">⏸ pause</button>
    <button onclick="stepFrame()">⏭ step</button>
  </div>

  <div class="fps-control">
    <label>FPS:</label>
    <input type="number" id="fpsInput" value="6" min="1" max="30" onchange="updateFPS(this.value)">
  </div>

  <div class="info">
    <strong>当前动作集：</strong>
    <ul style="margin-top: 8px; padding-left: 20px;">
      <li><strong>idle</strong> — 4 帧：呼吸眨眼待机循环</li>
      <li><strong>clickDefend</strong> — 6 帧：受惊 → 耸肩 → 放松 → 傲娇恢复</li>
    </ul>
    <br>
    <strong>使用方法：</strong>点击按钮切换动作，调整 FPS 观察速度。
  </div>

  <script>
    const canvas = document.getElementById('petCanvas')
    const ctx = canvas.getContext('2d')
    const frameCounter = document.getElementById('frameCounter')

    // 帧资源配置 — 透明 PNG 版本
    const CLIPS = {
      idle: {
        fps: 6,
        loop: true,
        frames: [
          '/pet/xiaowen/frames/idle/idle_01.png',
          '/pet/xiaowen/frames/idle/idle_02.png',
          '/pet/xiaowen/frames/idle/idle_03.png',
          '/pet/xiaowen/frames/idle/idle_04.png',
        ]
      },
      clickDefend: {
        fps: 12,
        loop: false,
        frames: [
          '/pet/xiaowen/frames/click_defend/click_defend_01.png',
          '/pet/xiaowen/frames/click_defend/click_defend_02.png',
          '/pet/xiaowen/frames/click_defend/click_defend_03.png',
          '/pet/xiaowen/frames/click_defend/click_defend_04.png',
          '/pet/xiaowen/frames/click_defend/click_defend_05.png',
          '/pet/xiaowen/frames/click_defend/click_defend_06.png',
        ]
      }
    }

    // 预加载图片
    const imageCache = {}
    let loadedCount = 0
    let totalImages = 0

    Object.values(CLIPS).forEach(clip => {
      totalImages += clip.frames.length
      clip.frames.forEach(src => {
        const img = new Image()
        img.src = src
        img.onload = () => {
          loadedCount++
          if (loadedCount >= totalImages && currentClip) {
            running = true
            requestAnimationFrame(animate)
          }
        }
        imageCache[src] = img
      })
    })

    let currentClip = CLIPS.idle
    let currentIndex = 0
    let frameTimer = 0
    let lastTime = 0
    let running = false
    let paused = false
    let customFPS = 6

    function playClip(name, loop) {
      currentClip = CLIPS[name]
      currentIndex = 0
      frameTimer = 0
      paused = false
      running = true

      document.querySelectorAll('button').forEach(b => b.classList.remove('active'))
      event.target.classList.add('active')

      if (loadedCount >= totalImages) {
        requestAnimationFrame(animate)
      }
    }

    function togglePause() {
      paused = !paused
      if (!paused && running) {
        lastTime = 0
        requestAnimationFrame(animate)
      }
    }

    function stepFrame() {
      paused = true
      currentIndex = (currentIndex + 1) % currentClip.frames.length
      draw()
    }

    function updateFPS(val) {
      customFPS = parseInt(val) || 6
    }

    function draw() {
      ctx.clearRect(0, 0, 256, 256)
      const src = currentClip.frames[currentIndex]
      const img = imageCache[src]
      if (img && img.complete) {
        // 居中绘制
        const x = (256 - img.width) / 2
        const y = (256 - img.height) / 2
        ctx.drawImage(img, x, y)
      }
      frameCounter.textContent = `frame: ${currentIndex + 1} / ${currentClip.frames.length}`
    }

    function animate(timestamp) {
      if (!running || paused) return

      const dt = lastTime ? Math.min(timestamp - lastTime, 100) : 16
      lastTime = timestamp

      const fps = customFPS
      const frameDuration = 1000 / fps

      frameTimer += dt
      if (frameTimer >= frameDuration) {
        frameTimer = 0
        currentIndex++
        if (currentIndex >= currentClip.frames.length) {
          if (currentClip.loop) {
            currentIndex = 0
          } else {
            currentIndex = currentClip.frames.length - 1
            running = false
          }
        }
      }

      draw()

      if (running) {
        requestAnimationFrame(animate)
      }
    }

    // 启动 idle
    if (loadedCount >= totalImages) {
      running = true
      requestAnimationFrame(animate)
    }
  </script>
</body>
</html>
