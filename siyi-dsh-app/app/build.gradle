apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// 加载 app/version.properties（CI 在 gradle 之前生成）。
// ⚠ Gradle 只自动加载 gradle.properties；自定义文件必须显式 load，
//   否则 findProperty 返回 null，versionCode 会一直是默认值 2026111201，
//   每次构建都一样，部分 ROM 就会拒绝覆盖安装。
def siyiVersionProps = new Properties()
def siyiVersionFile = file('version.properties')
if (siyiVersionFile.exists()) {
    siyiVersionFile.withInputStream { siyiVersionProps.load(it) }
    logger.lifecycle("siyi version: " + siyiVersionProps)
} else {
    logger.lifecycle("siyi version.properties 不存在，用默认值")
}

android {
    namespace 'com.siyi.dshapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.siyi.dshapp"
        minSdk 26
        targetSdk 34
        // versionCode 必须递增，否则部分 ROM 会拒绝覆盖安装。
        // 用日期做基数（2026-11-12 -> 20261112），配合 CI 传入的 build 号。
        // ⚠ Groovy 不是 Kotlin：String 上没有 toInt()，只有 toInteger()。
        // 写成 .toInt() 会让整个构建在配置阶段就崩（No signature of method），
        // 表现是 Build debug APK 8 秒失败、什么都没编出来。
        // 从 properties 文件读，不用 System.getenv。
        // 原因：System.getenv 在 Gradle **配置阶段**（configuration phase）拿到的是
        // Gradle daemon 启动时的环境快照，同一步骤里 export 的变量读不到，
        // 结果 versionCode 永远取默认值 2026111201，每次构建都一样，
        // 部分 ROM 会因此拒绝覆盖安装。
        // CI 会在 gradle 之前生成 app/version.properties，内容形如：
        //   siyi.versionCode=2026111242
        //   siyi.versionName=0.34.242
        versionCode = siyiVersionProps.getProperty("siyi.versionCode", "2026111201").toString().toInteger()
        versionName = siyiVersionProps.getProperty("siyi.versionName", "0.34.0").toString()
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        debug {
            // 与 release 同签名，便于后续升级；仅用于自用
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    // 设备桥的 JNI 辅助（socketpair）。只编一个极小 so，无第三方依赖。
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    ndkVersion '26.1.10909125'

    // 关键：不要压缩 .so，且把 jniLibs 打进 APK
    packagingOptions {
        // 绝不能打进 NDK 自带的 libc++_shared.so：
        // 官方 APK 里那份是 9.3MB 完整版，libnode.so 依赖它；
        // NDK 那份 1.4MB 精简版覆盖后引擎会直接崩。
        // jniLibs 目录里由 CI 从官方 APK 提取，用 pickFirsts 保证它优先。
        jniLibs {
            useLegacyPackaging = true
            // 双保险：即便 NDK 产物混进来也优先保留 jniLibs 里那份
            pickFirsts += ['**/libc++_shared.so']
        }
    }
    androidResources {
        noCompress 'zip', 'so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.google.android.material:material:1.12.0'
}
