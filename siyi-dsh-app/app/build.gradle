apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.siyi.dshapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.siyi.dshapp"
        minSdk 26
        targetSdk 34
        // versionCode 必须递增，否则部分 ROM 会拒绝覆盖安装。
        // 用日期做基数（2026-11-12 -> 20261112），配合 CI 传入的 build 号。
        // ⚠ Groovy 不是 Kotlin：String 上没有 toInt()，只有 toInteger()。
        // 写成 .toInt() 会让整个构建在配置阶段就崩（No signature of method），
        // 表现是 Build debug APK 8 秒失败、什么都没编出来。
        versionCode = (System.getenv("SIYI_VERSION_CODE") ?: "2026111201").toInteger()
        versionName = System.getenv("SIYI_VERSION_NAME") ?: "0.33.0"
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        debug {
            // 与 release 同签名，便于后续升级；仅用于自用
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    // 设备桥的 JNI 辅助（socketpair）。只编一个极小 so，无第三方依赖。
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    ndkVersion '26.1.10909125'

    // 关键：不要压缩 .so，且把 jniLibs 打进 APK
    packagingOptions {
        // 绝不能打进 NDK 自带的 libc++_shared.so：
        // 官方 APK 里那份是 9.3MB 完整版，libnode.so 依赖它；
        // NDK 那份 1.4MB 精简版覆盖后引擎会直接崩。
        // jniLibs 目录里由 CI 从官方 APK 提取，用 pickFirsts 保证它优先。
        jniLibs {
            useLegacyPackaging = true
            // 双保险：即便 NDK 产物混进来也优先保留 jniLibs 里那份
            pickFirsts += ['**/libc++_shared.so']
        }
    }
    androidResources {
        noCompress 'zip', 'so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.google.android.material:material:1.12.0'
}
