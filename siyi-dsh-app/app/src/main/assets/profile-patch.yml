# 独立启动时 base 里这四行被 profileContext 门控禁用，导致 settings 不挂载。
# 实际运行使用的是官方 profile-boot 流程，profileContext 存在，直接解禁即可。
- id: plugin-manager
  disabled: false
- id: hmr
  disabled: true
- id: config-editor
  disabled: false
- id: settings
  disabled: false

# 预置已读标记，避免首次启动被预览版说明弹窗挡住
- id: ui-settings-general
  config:
    welcomeNoticeVersion: "2026-09-28.1"

# ── 模型来源 ────────────────────────────────
# 预置本机 pack 网关作为 provider，装完即可对话。
# 注意：service-lite 是普通插件不是 bundle，必须用 insert 挂载。
- insert:
    - id: llm-service-lite
      name: "@snnh/dsh-llm-service-lite"
      config:
        providers:
          local:
            displayName: 本机网关
            interfaceType: openai-chat-completions
            baseURL: http://127.0.0.1:8427/v1
            # 密钥不进版本库：运行时由 App 侧从 /sdcard/思忆集/app/gateway.key 读，
            # 写进环境变量 SIYI_GATEWAY_KEY。没配置时用占位串避免配置校验失败，
            # 模型调用会 401，界面会明确提示「本机网关未配置密钥」。
            apiKey: !!js "process.env.SIYI_GATEWAY_KEY || 'unset'"
            includeUsage: true
            models:
              - id: loomy/qwen3.8-flash
                contextWindow: 1000000
                maxTokens: 16384
              - id: loomy/DeepSeek-V4.1-Flash
                contextWindow: 1048576
                maxTokens: 65536
              - id: loomy/GLM-5.3-Flash
                contextWindow: 1048576
                maxTokens: 16384
              - id: minimax/MiniMax-M3.1-Flash
                contextWindow: 1000000
                maxTokens: 131072
              - id: buddy/deepseek-v4-flash
                contextWindow: 262144
                maxTokens: 16384
              - id: buddy/hy4free
                contextWindow: 1000000
                maxTokens: 16384
- id: agent-default-model
  config:
    provider: local
    # 钉在 minimax：其余渠道长期限流或掉凭据，默认走 loomy 时每轮都要先失败
    # 一次、再靠 8427 的兜底链落到 minimax，白等 2~3 秒。
    model: minimax/MiniMax-M3.1-Flash

# ── 设备能力桥 ────────────────────────────────────────────────
# App 侧 EngineService 通过 DSH_BRIDGE_FD 传入 socketpair 的一端，
# 这个插件负责从 fd 读能力清单并注册成 dsh 工具。
# 没有它，桥接 fd 会被忽略，device_* 工具不会出现。
- insert:
    - id: android-device
      name: '@dsh-android/plugin-device'

# ── 工具面解禁（对齐 DSH android profile）────────────────────
# web profile 默认禁用了一批工具（它走 preset 架构另行挂载）。
# 思忆集没有 preset 会话，所以这里逐条解禁，恢复完整工具面：
# 读写文件、内容搜索、执行 shell、后台任务、子代理、待办、联网、计划模式。
# 缺了这些，模型只能「聊」，不能「干活」。
- id: tool-bash
  disabled: false
- id: tool-pwsh
  disabled: false
- id: tool-jobs
  disabled: false
- id: tool-fs
  disabled: false
- id: tool-fs-search
  disabled: false
- id: skill-filesystem
  disabled: false
- id: tool-skill
  disabled: false
- id: tool-todo
  disabled: false
- id: tool-web
  disabled: false
- id: tool-subagent
  disabled: false
- id: tool-subagent-control
  disabled: false
- id: tool-subagent-fork
  disabled: false
- id: tool-subagent-list-agents
  disabled: false
- id: plan-mode
  disabled: false
- id: command-compact
  disabled: false
- id: compaction-basic
  disabled: false
- id: tool-result-pruner
  disabled: false
- id: tool-plugin-manager
  disabled: false
- id: agent-instructions
  disabled: false

# ── 沙箱与审批 ──────────────────────────────────────────────
# Android 没有 bwrap/Landlock/seatbelt（sandbox-local 会 fail closed），
# 所以必须显式设 danger-full-access 并依赖审批把关，
# 否则 bash/文件写入一执行就报 no sandbox backend is usable。
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js "process.env.HOME || process.cwd()"

- id: approval
  config:
    policy: ask

- id: permission
  config:
    defaultPreset: android
    presets:
      android:
        sandbox: danger-full-access
        approval: ask
        name: android
        description: Android 无 OS 沙箱；每个改机动作都会请求审批。

# ── 思忆集 UI 插件 ──────────────────────────────────────────
# 移动端布局补丁：设置面板在窄屏改为「顶部横向标签 + 下方内容」，
# 并禁止中文逐字换行。原先 panel 固定 800px、nav 固定 188px，
# 在 376px 视口的手机上右栏只剩约 140px，导致文字竖排。
# 注意：客户端插件必须在 cordis 树里 insert 才会被清单扫描到。
- insert:
    - id: siyi-mobile-layout
      name: 'dsh-client-ui-siyi-mobile'

# ── 登录支持 ────────────────────────────────────────────────
# dsh-base 会挂 deepseek-account provider（OAuth + PKCE），但它需要一个
# 本地回调服务器来接授权码，否则前端点登录后一直等回调，表现为白屏。
# 官方 bundle-android 就是靠这条挂上 @dsh-android/plugin-account，
# 思忆集此前缺这一条，所以登录页空白。
- insert:
    - id: android-account
      name: '@dsh-android/plugin-account'
      config:
        locale: !!js "process.env.DSH_ANDROID_LOCALE || ''"
        # 应用内登录 WebView 完成后会打开这个 scheme 回到 App
        appScheme: dsh-android
        appPackage: com.siyi.dshapp

# ── 用户插件动态加载器（免 CI 扩展）────────────────────────
# 引擎启动时扫描 DSH_USER_PLUGINS 目录（App 注入，默认 /sdcard/思忆集/plugins），
# 把每个 .js 当作一个 DSH 插件加载。以后加能力只需往目录里丢文件并重启引擎。
- insert:
    - id: siyi-user-plugins
      name: 'dsh-user-plugins'
