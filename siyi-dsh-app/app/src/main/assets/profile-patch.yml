# 独立启动时 base 里这四行被 profileContext 门控禁用，导致 settings 不挂载。
# 实际运行使用的是官方 profile-boot 流程，profileContext 存在，直接解禁即可。
- id: plugin-manager
  disabled: false
- id: hmr
  disabled: true
- id: config-editor
  disabled: false
- id: settings
  disabled: false

# 预置已读标记，避免首次启动被预览版说明弹窗挡住
- id: ui-settings-general
  config:
    welcomeNoticeVersion: "2026-09-28.1"

# ── 模型来源 ────────────────────────────────
# 预置本机 pack 网关作为 provider，装完即可对话。
# 注意：service-lite 是普通插件不是 bundle，必须用 insert 挂载。
- insert:
    - id: llm-service-lite
      name: "@snnh/dsh-llm-service-lite"
      config:
        providers:
          local:
            displayName: 本机网关
            interfaceType: openai-chat-completions
            baseURL: http://127.0.0.1:8427/v1
            apiKey: x9_oulU0SPbg490TBnD_hEapn09Qv36vSYaaxSrim-g
            includeUsage: true
            models:
              - id: loomy/qwen3.8-flash
                contextWindow: 1000000
                maxTokens: 16384
              - id: loomy/DeepSeek-V4.1-Flash
                contextWindow: 1048576
                maxTokens: 65536
              - id: loomy/GLM-5.3-Flash
                contextWindow: 1048576
                maxTokens: 16384
              - id: minimax/MiniMax-M3.1-Flash
                contextWindow: 1000000
                maxTokens: 131072
              - id: buddy/deepseek-v4-flash
                contextWindow: 262144
                maxTokens: 16384
              - id: buddy/hy4free
                contextWindow: 1000000
                maxTokens: 16384
- id: agent-default-model
  config:
    provider: local
    model: loomy/qwen3.8-flash

# ── 设备能力桥 ────────────────────────────────────────────────
# App 侧 EngineService 通过 DSH_BRIDGE_FD 传入 socketpair 的一端，
# 这个插件负责从 fd 读能力清单并注册成 dsh 工具。
# 没有它，桥接 fd 会被忽略，device_* 工具不会出现。
- insert:
    - id: android-device
      name: '@dsh-android/plugin-device'
