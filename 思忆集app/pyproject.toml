[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "siyiji-app"
version = "1.0.0"
description = "思忆集 — 双端 AI 桌面助手"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.0,<2.0",
    "sentence-transformers>=2.2,<5.0",
    "requests>=2.31,<3.0",
    "httpx>=0.26,<1.0",
    "aiohttp>=3.9,<4.0",
    "beautifulsoup4>=4.12,<5.0",
    "bleach>=6.0,<7.0",
    "PyYAML>=6.0,<7.0",
    "Markdown>=3.5,<4.0",
    "jieba>=0.42,<1.0",
    "APScheduler>=3.10,<4.0",
    "pypdf>=6.17,<7.0",
    "python-docx>=1.0,<2.0",
    "readability-lxml>=0.8,<1.0",
    "qrcode>=7.4,<9.0",
    "Pillow>=10.0,<13.0",
    "psutil>=5.9,<7.0",
    "numpy>=1.24,<3.0",
    "pydantic>=2.0,<3.0",
    "python-dateutil>=2.8,<3.0",
    "pytz>=2024.0",
    "cryptography>=42.0,<49.0",
    "openai>=1.0,<2.0",
    "fsrs>=6.0,<8.0",
    "pydantic-ai-slim>=2.0,<3.0",
    "playwright>=1.40,<2.0",
    "jsonschema>=4.0,<5.0",
    "feedparser>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<7.0",
    "pytest-xdist>=3.6,<4.0",
    "pyinstaller>=6.0,<7.0",
]
# 旧版 PyQt6 桌面端依赖（新版 Electron 前端 + 无头后端不需要）
desktop = [
    "PyQt6>=6.5,<7.0",
    "PyQt6-WebEngine>=6.5,<7.0",
]
# P2.1 本地音频转写（faster-whisper 基于 CTranslate2，比 transformers 快 4-5x）
# 安装：pip install -e ".[transcription]"
# 非 WAV 格式还需系统层 ffmpeg（由 faster-whisper 内部 av 包调用）
transcription = [
    "faster-whisper>=1.0,<2.0",
]
# P2.2 OCR 文字识别（Pillow 已在核心 dependencies，此处仅追加 pytesseract）
# 安装：pip install -e ".[ocr]"
# 还需系统层 Tesseract 引擎：Windows 走 UB-Mannheim build，Linux 走 apt install tesseract-ocr
ocr = [
    "pytesseract>=0.3,<1.0",
]

# Flat layout — all .py files live directly in this directory.
# pip install -e . installs only the dependencies without building a package.
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: WebSocket RPC 集成测试（需要后端运行/隔离临时后端）",
    "smoke: 核心入口健康冒烟",
    "unit: 纯单元测试（不依赖后端/网络）",
    "slow: 慢测，需显式启用（如 SIYI_RUN_SLOW_VENV=1）",
    # 2026-09-18 补注册：env-drill 三演练此前未登记，导致每次跑都刷 3 条
    # PytestUnknownMarkWarning（cosmetic 噪声，但会淹没真实告警）
    "env_drill_t1: env-drill T1 —— kill -9 数据一致性（原子写/半写检测/句柄占用退避）",
    "env_drill_t2: env-drill T2 —— 时钟跳变（回拨/前进对 cron、TTL、lease 的影响）",
    "env_drill_t3: env-drill T3 —— 磁盘故障注入（OSError 下的数据完整性与错误上报）",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["ai", "app_runtime", "backend", "core", "data", "repositories", "memory", "adapters", "api", "services", "sync"]
omit = [
    "tests/*",
    "build/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.setuptools]
packages = []
