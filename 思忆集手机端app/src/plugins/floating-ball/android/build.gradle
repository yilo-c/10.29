apply plugin: 'com.android.library'

android {
    namespace 'com.siyi.plugins.floatingball'
    compileSdk rootProject.ext.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34

    defaultConfig {
        minSdk rootProject.ext.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdk rootProject.ext.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    compileOnly project(':capacitor-android')
}
